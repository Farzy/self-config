[project]
name = "self-config"
version = "1.0.0"
description = "Infrastructure as Code for Farzad's computers"
authors = [
    {name = "Farzad FARID", email = "farzy@farzy.org"},
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "ansible >=13.0.0, <15.0.0",
    "apache-libcloud >=3.4.1, <4.0.0",
    "boto >=2.49.0, <3.0.0",
    "boto3 >=1.20.45, <2.0.0",
    "cryptography>=48.0.1,<51.0.0",
    "jmespath >=1.0.1, <2.0.0",
    "passlib >=1.7.4, <2.0.0,",
    "openshift >=0.13, <1.0",
    "scaleway-sdk >=1.15.0, <2.0.0",
    "kubernetes >=29.0.0, <37.0.0",
    "jsonpatch >=1.33, <2.0",
    "pre-commit >=3.7.0, <5.0.0",
]

[dependency-groups]
# Linters CI needs but a normal `uv sync` should not pull in. Kept in the
# lockfile so GitHub Actions and pre-commit converge on the same versions.
lint = [
    "ansible-lint >=25.0.0, <27.0.0",
    "yamllint >=1.35.0, <2.0.0",
]

[tool.uv]
# Not an installable package (no [build-system]); replaces the old Poetry
# `package-mode = false`, which is not valid under [project].
package = false
default-groups = []
