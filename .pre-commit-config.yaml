repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # yamllint and ansible-lint run out of the project venv rather than a
  # pre-commit-managed one, so their versions come from uv.lock — the same
  # source the CI workflow installs from. Previously these were upstream hooks
  # with their own `rev:` and `additional_dependencies:`, which drifted: the
  # hook pinned ansible-lint v26.6.0 and ansible 14.2.0 while uv.lock resolved
  # ansible-lint 26.8.0 and ansible 13.7.0. CI and pre-commit then ran different
  # linters, so a locally-green branch could go red on the PR.
  #
  # `--group lint` matches the group CI syncs; `[tool.uv] default-groups = []`
  # means a plain `uv sync` still leaves these out.
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint
        description: Lint YAML using the ruleset shared with the CI workflow.
        entry: uv run --group lint yamllint -c .github/yamllint.yml
        language: system
        types: [yaml]

      - id: ansible-lint
        name: ansible-lint
        description: Lint the Ansible tree.
        # Mirrors the upstream hook: ansible-lint discovers its own file set, so
        # passing changed filenames makes it lint the wrong thing.
        # https://github.com/ansible/ansible-lint/issues/611
        entry: uv run --group lint ansible-lint --force-color
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.0
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint

  # GitHub Actions workflows: actionlint catches shell and expression errors,
  # zizmor audits them for security issues (template injection, over-broad
  # permissions, unpinned actions). Both matter more than usual here because
  # this repository is public and one workflow holds SSH access to a server.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^ansible/
