# actionlint's built-in metadata for anthropics/claude-code-action@v1 predates the
# workload identity federation inputs, which the action's own action.yml defines.
# Remove this once actionlint knows them.
paths:
  .github/workflows/claude-review.yml:
    ignore:
      - 'input "anthropic_(federation_rule_id|organization_id|service_account_id|workspace_id)" is not defined in action "anthropics/claude-code-action@v1"'
