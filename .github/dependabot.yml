version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain hardening: wait before adopting a brand-new release, so a
    # compromised or yanked version has time to be caught upstream. Dependabot
    # applies cooldown to version updates only — security updates are never
    # delayed by it.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain hardening: wait before adopting a brand-new release, so a
    # compromised or yanked version has time to be caught upstream. Dependabot
    # applies cooldown to version updates only — security updates are never
    # delayed by it.
    cooldown:
      # semver-major-days is rejected by Dependabot's config validation for
      # this ecosystem, so major bumps share the 7-day default cooldown.
      default-days: 7
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    # Supply-chain hardening: wait before adopting a brand-new release, so a
    # compromised or yanked version has time to be caught upstream. Dependabot
    # applies cooldown to version updates only — security updates are never
    # delayed by it.
    cooldown:
      # semver-major-days is rejected by Dependabot's config validation for
      # this ecosystem, so major bumps share the 7-day default cooldown.
      default-days: 7
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain hardening: wait before adopting a brand-new release, so a
    # compromised or yanked version has time to be caught upstream. Dependabot
    # applies cooldown to version updates only — security updates are never
    # delayed by it.
    cooldown:
      # semver-major-days is rejected by Dependabot's config validation for
      # this ecosystem, so major bumps share the 7-day default cooldown.
      default-days: 7
    groups:
      security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      version-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
