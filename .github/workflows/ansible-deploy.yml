name: '🚀 Ansible Deploy'

# The only workflow in this repository that reaches a real server.
#
# Safety model (this is a PUBLIC repo — job logs are world-readable):
#   * Never triggered by pull request content. `workflow_dispatch` is restricted
#     by GitHub to users with write access; `push`/`schedule` only ever run in
#     --check mode.
#   * `apply` runs go through the `claw-production` environment, whose required
#     reviewer is the second factor between a dispatch click and a live change.
#   * SSH host keys are pinned from ansible/known_hosts, and the run is refused
#     outright if the requested --limit resolves to a host with no pin.
#   * Credentials are written to $RUNNER_TEMP with umask 077 and shredded in an
#     always() step; nothing is ever written into the workspace.
#   * `--diff` is off by default (ansible.cfg turns it on) because rendered
#     templates can contain vault-decrypted secrets, and these logs are public.

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Playbook to run'
        type: 'choice'
        required: true
        default: 'openclaw.yml'
        # Intentionally a one-item list. Adding a playbook here is a reviewed
        # change that should land together with the target hosts' SSH host keys
        # in ansible/known_hosts — see docs/ci-ansible.md.
        options:
          - 'openclaw.yml'
      mode:
        description: 'check = dry run (no changes), apply = converge for real'
        type: 'choice'
        required: true
        default: 'check'
        options:
          - 'check'
          - 'apply'
      limit:
        description: 'Ansible --limit pattern (host or group)'
        type: 'string'
        required: true
        default: 'openclaw'
      tags:
        description: 'Only run these tags (comma separated, blank = all)'
        type: 'string'
        required: false
        default: ''
      skip_tags:
        description: 'Skip these tags (comma separated)'
        type: 'string'
        required: false
        default: ''
      diff:
        description: '⚠️ Show --diff. Logs are PUBLIC — rendered templates may contain secrets.'
        type: 'boolean'
        required: false
        default: false
      verbosity:
        description: 'Ansible verbosity'
        type: 'choice'
        required: false
        # 'default' rather than an empty option: GitHub rejects an empty string
        # in a choice list. The run step maps it back to "pass no -v flag".
        default: 'default'
        options:
          - 'default'
          - '-v'
          - '-vv'
          - '-vvv'

  # Post-merge drift detection. Check mode only: merging cannot change a server.
  push:
    branches: ['main']
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-deploy.yml'

  # Weekly drift detection, so configuration changed by hand on the box shows up
  # even during a quiet week.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: 'read'

# Never let two Ansible runs hit the same host at once, and never cancel one
# mid-flight — a half-applied converge is worse than a queued one.
#
# A single group for check and apply is intentional: separate groups would let a
# drift check and a converge run against the same host simultaneously, which is
# the thing this exists to prevent. The cost is that GitHub keeps at most one
# *pending* run per group, so a newly queued run can cancel an apply that is
# still sitting at the claw-production approval prompt. That is annoying but
# fail-safe — the cancelled run is one that had not been approved and therefore
# never touched the server. Re-dispatch it. See docs/ci-ansible.md §5.
concurrency:
  group: 'ansible-deploy'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

jobs:
  ansible:
    name: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
          && 'Apply' || 'Check' }} ${{ inputs.limit || 'openclaw' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45

    # The approval gate. `claw-check` should have no protection rules;
    # `claw-production` should require a reviewer and restrict deployment
    # branches to `main`. See docs/ci-ansible.md.
    environment: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
          && 'claw-production' || 'claw-check' }}

    env:
      # Inputs are surfaced as environment variables rather than interpolated
      # into `run:` bodies: a `${{ }}` inside a shell script is a template
      # injection sink, and free-text inputs (limit/tags) are attacker-shaped
      # even when the attacker is a tired maintainer.
      PLAYBOOK: "${{ inputs.playbook || 'openclaw.yml' }}"
      MODE: "${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || 'check' }}"
      LIMIT: "${{ inputs.limit || 'openclaw' }}"
      TAGS: '${{ inputs.tags }}'
      SKIP_TAGS: '${{ inputs.skip_tags }}'
      VERBOSITY: '${{ inputs.verbosity }}'

      # ansible.cfg sets `[diff] always = True`, which is right on a laptop and
      # wrong in a public log. Opt in per run.
      ANSIBLE_DIFF_ALWAYS: "${{ inputs.diff && 'true' || 'false' }}"

      ANSIBLE_FORCE_COLOR: '1'
      PY_COLORS: '1'
      # Per-task timings make a slow converge diagnosable from the log alone.
      ANSIBLE_CALLBACKS_ENABLED: 'ansible.posix.profile_tasks'

      # ANSIBLE_VAULT_PASSWORD_FILE / ANSIBLE_VAULT_IDENTITY_LIST cannot be set
      # here — the `runner` context is not available in a job-level `env:` — so
      # the 'Materialise credentials' step exports them via $GITHUB_ENV instead.

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Redirect the Ansible log out of the workspace'
        # ansible/ansible.cfg sets `log_path = ../log/ansible.log`, which every
        # ansible command honours — not just ansible-playbook. Setting this on
        # the 'Run Ansible' step alone left the host-pinning gate's
        # `ansible-inventory` call writing $GITHUB_WORKSPACE/log/ansible.log,
        # contradicting the "nothing is written into the workspace" invariant
        # and quietly becoming a real leak the moment a group_vars file with
        # !vault values exists. Exported here so it covers every later step.
        run: 'echo "ANSIBLE_LOG_PATH=${RUNNER_TEMP}/ansible.log" >> "${GITHUB_ENV}"'

      - name: 'Set up uv'
        uses: 'astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d' # ratchet:astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: 'Install pinned Python toolchain'
        run: 'uv sync --locked'

      - name: 'Restore Ansible collections cache'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # ratchet:actions/cache@v6
        with:
          path: '~/.ansible/collections'
          # No `restore-keys:` on purpose. A prefix fallback would restore an
          # older cache on a key miss, and `ansible-galaxy collection install`
          # then reports "already installed" and does nothing — so the effective
          # collection versions would be whatever was resolved when the cache
          # was first populated, and editing requirements.yml would not change
          # them. An exact-key-only cache means a requirements change is a cache
          # miss and a genuine reinstall.
          key: "ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml', 'uv.lock') }}"

      - name: 'Install Ansible collections'
        run: 'uv run ansible-galaxy collection install --requirements-file ansible/requirements.yml'

      # Deliberately ahead of the host-pinning gate: that gate shells out to
      # `ansible-inventory`, which refuses to start when the vault password file
      # named in ansible.cfg is absent. Writing the credentials does not open any
      # connection, so nothing is reachable until the gate has passed.
      - name: 'Materialise credentials'
        env:
          CI_SSH_PRIVATE_KEY: '${{ secrets.CI_SSH_PRIVATE_KEY }}'
          ANSIBLE_VAULT_PASSWORD: '${{ secrets.ANSIBLE_VAULT_PASSWORD }}'
        # $RUNNER_TEMP, never the workspace: nothing here can be picked up by a
        # later `actions/upload-artifact` or committed by accident.
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${CI_SSH_PRIVATE_KEY}" ]; then
            echo "::error::Secret CI_SSH_PRIVATE_KEY is not set. See docs/ci-ansible.md."
            exit 1
          fi
          if [ -z "${ANSIBLE_VAULT_PASSWORD}" ]; then
            echo "::error::Secret ANSIBLE_VAULT_PASSWORD is not set. See docs/ci-ansible.md."
            exit 1
          fi

          printf '%s\n' "${CI_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/ci_ssh_key"
          printf '%s\n' "${ANSIBLE_VAULT_PASSWORD}" > "${RUNNER_TEMP}/vault_pass"
          chmod 600 "${RUNNER_TEMP}/ci_ssh_key" "${RUNNER_TEMP}/vault_pass"

          # Fail here with a clear message rather than as an opaque UNREACHABLE
          # 90 seconds later, e.g. when the secret was pasted without its
          # trailing newline or with the PEM header mangled.
          if ! ssh-keygen -y -f "${RUNNER_TEMP}/ci_ssh_key" > /dev/null 2>&1; then
            echo "::error::CI_SSH_PRIVATE_KEY is not a valid, unencrypted private key."
            exit 1
          fi

          # Exported for every later step, not just 'Run Ansible': ansible.cfg
          # declares `vault_password_file = ~/.ansible-personal-key`, and *any*
          # ansible command aborts when that file is missing — including the
          # `ansible-inventory` call in the host-pinning gate, which never
          # decrypts anything. The `personal` label must match the vault ID the
          # vars were encrypted under.
          {
            echo "ANSIBLE_VAULT_PASSWORD_FILE=${RUNNER_TEMP}/vault_pass"
            echo "ANSIBLE_VAULT_IDENTITY_LIST=personal@${RUNNER_TEMP}/vault_pass"
          } >> "${GITHUB_ENV}"

      - name: 'Refuse to target hosts without a pinned SSH host key'
        working-directory: 'ansible'
        # This is the blast-radius control. `--limit` is free text, and a typo
        # or a paste error could otherwise aim a converge at every host in the
        # inventory. Resolving the pattern first and requiring each resulting
        # host to be pinned in known_hosts means CI can only ever reach hosts
        # whose identity has been reviewed into the repository.
        run: |
          set -euo pipefail

          if ! hosts="$(uv run ansible-inventory --list --limit "${LIMIT}" | jq -r '._meta.hostvars | keys[]')"; then
            echo "::error::Could not resolve --limit '${LIMIT}' against the inventory."
            exit 1
          fi

          if [ -z "${hosts}" ]; then
            echo "::error::--limit '${LIMIT}' matches no hosts. Refusing to run."
            exit 1
          fi

          unpinned=0
          while read -r host; do
            if ssh-keygen -F "${host}" -f known_hosts > /dev/null 2>&1; then
              echo "✓ ${host} (host key pinned)"
            else
              printf '::error file=ansible/known_hosts::%s%s\n' \
                "'${host}' has no pinned SSH host key. " \
                "Add one with: ssh-keyscan -t ed25519,ecdsa,rsa ${host} >> ansible/known_hosts"
              unpinned=1
            fi
          done <<< "${hosts}"

          if [ "${unpinned}" -ne 0 ]; then
            echo "::error::Refusing to deploy: at least one target host is not pinned."
            exit 1
          fi

          {
            echo "TARGET_HOSTS<<EOF"
            echo "${hosts}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: 'Show run plan'
        run: |
          set -euo pipefail
          {
            echo "### Ansible ${MODE} — \`${LIMIT}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Playbook | \`${PLAYBOOK}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| Limit | \`${LIMIT}\` |"
            echo "| Tags | \`${TAGS:-<all>}\` |"
            echo "| Skip tags | \`${SKIP_TAGS:-<none>}\` |"
            echo "| Diff | \`${ANSIBLE_DIFF_ALWAYS}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:8}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo
            echo "Targets:"
            echo '```'
            echo "${TARGET_HOSTS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 'Run Ansible'
        working-directory: 'ansible'
        env:
          ANSIBLE_PRIVATE_KEY_FILE: '${{ runner.temp }}/ci_ssh_key'
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          # SSH_COMMON_ARGS rather than SSH_ARGS so ansible.cfg's ControlMaster
          # settings survive. IdentitiesOnly stops ssh from offering any other
          # key it happens to find and tripping MaxAuthTries.
          ANSIBLE_SSH_COMMON_ARGS: >-
            -o UserKnownHostsFile=${{ github.workspace }}/ansible/known_hosts
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o ConnectTimeout=15
        run: |
          set -euo pipefail

          args=( "playbooks/${PLAYBOOK}" --limit "${LIMIT}" )

          if [ "${MODE}" = 'check' ]; then
            args+=( --check )
          fi
          if [ -n "${TAGS}" ]; then
            args+=( --tags "${TAGS}" )
          fi
          if [ -n "${SKIP_TAGS}" ]; then
            args+=( --skip-tags "${SKIP_TAGS}" )
          fi
          if [ -n "${VERBOSITY}" ] && [ "${VERBOSITY}" != 'default' ]; then
            args+=( "${VERBOSITY}" )
          fi

          echo "Running: ansible-playbook ${args[*]}"
          uv run ansible-playbook "${args[@]}"

      - name: 'Record success'
        if: success()
        run: |
          set -euo pipefail
          if [ "${MODE}" = 'check' ]; then
            {
              echo "✅ Check completed. Read the task recap above for \`changed\` counts —"
              echo "in check mode those are *pending* changes, not applied ones."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "✅ Applied to \`${LIMIT}\`." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: 'Record failure'
        if: failure()
        run: |
          {
            echo "❌ Run failed. Note that not every task is check-mode safe, so a red"
            echo "*check* run does not always mean real drift."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 'Shred credentials'
        if: always()
        run: |
          shred --remove --force \
            "${RUNNER_TEMP}/ci_ssh_key" \
            "${RUNNER_TEMP}/vault_pass" \
            "${RUNNER_TEMP}/ansible.log" 2> /dev/null || true
          rm -f "${RUNNER_TEMP}/ci_ssh_key" "${RUNNER_TEMP}/vault_pass" "${RUNNER_TEMP}/ansible.log"
