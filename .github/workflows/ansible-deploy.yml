name: '🚀 Ansible Deploy'

# The only workflow in this repository that reaches a real server.
#
# Safety model (this is a PUBLIC repo — job logs are world-readable):
#   * Never triggered by pull request content. `workflow_dispatch` is restricted
#     by GitHub to users with write access; `push`/`schedule` only ever run in
#     --check mode.
#   * `apply` runs go through the `claw-production` environment, whose required
#     reviewer is the second factor between a dispatch click and a live change.
#   * SSH host keys are pinned from ansible/known_hosts, and the run is refused
#     outright if the requested --limit resolves to a host with no pin.
#   * Credentials are written outside the workspace with umask 077 and shredded
#     in an always() step — the SSH key to $RUNNER_TEMP, the vault password to
#     ~/.ansible-personal-key because a role template reads that exact path.
#   * `--diff` is off by default (ansible.cfg turns it on) because rendered
#     templates can contain vault-decrypted secrets, and these logs are public.

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: 'Playbook to run'
        type: 'choice'
        required: true
        default: 'openclaw.yml'
        # Adding a playbook here is a reviewed change that must land together
        # with the target hosts' SSH host keys in ansible/known_hosts, their
        # group in ansible-ci.yml's CI_MANAGED_GROUPS, and an entry in the drift
        # matrix below — see docs/ci-ansible.md §7.
        options:
          - 'openclaw.yml'
          - 'linux.yml'
          - 'minecraft.yml'
      mode:
        description: 'check = dry run (no changes), apply = converge for real'
        type: 'choice'
        required: true
        default: 'check'
        options:
          - 'check'
          - 'apply'
      limit:
        description: 'Ansible --limit pattern — must match the chosen playbook (openclaw.yml -> openclaw, linux.yml -> linux_servers)'
        type: 'string'
        required: true
        default: 'openclaw'
      tags:
        description: 'Only run these tags (comma separated, blank = all)'
        type: 'string'
        required: false
        default: ''
      skip_tags:
        description: 'Skip these tags (comma separated)'
        type: 'string'
        required: false
        default: ''
      diff:
        description: '⚠️ Show --diff. Logs are PUBLIC — rendered templates may contain secrets.'
        type: 'boolean'
        required: false
        default: false
      verbosity:
        description: 'Ansible verbosity'
        type: 'choice'
        required: false
        # 'default' rather than an empty option: GitHub rejects an empty string
        # in a choice list. The run step maps it back to "pass no -v flag".
        default: 'default'
        options:
          - 'default'
          - '-v'
          - '-vv'
          - '-vvv'

  # Post-merge drift detection. Check mode only: merging cannot change a server.
  push:
    branches: ['main']
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-deploy.yml'

  # Weekly drift detection, so configuration changed by hand on the box shows up
  # even during a quiet week.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: 'read'

defaults:
  run:
    shell: 'bash'

jobs:
  # A dispatch runs exactly the one playbook/limit pair the operator chose. The
  # drift triggers (push to main, weekly cron) instead sweep every CI-managed
  # group, so adding a server to the pipeline means adding it here — otherwise
  # it is deployable by hand but never checked for drift.
  targets:
    name: 'Resolve targets'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    outputs:
      matrix: '${{ steps.resolve.outputs.matrix }}'
    steps:
      - name: 'Decide which playbook/limit pairs this run covers'
        id: 'resolve'
        env:
          IS_DISPATCH: "${{ github.event_name == 'workflow_dispatch' }}"
          PLAYBOOK: '${{ inputs.playbook }}'
          LIMIT: '${{ inputs.limit }}'
        run: |
          set -euo pipefail

          # `lock` is the concurrency key, and it is NOT always the limit.
          # Targets whose host sets overlap have to share one, or they can run
          # against the same machine simultaneously — minecraft-01 is in both
          # `linux_servers` (base OS, via linux.yml) and `minecraft` (the game
          # servers), and both playbooks run apt, so a parallel sweep would
          # race for the dpkg lock.
          if [ "${IS_DISPATCH}" = 'true' ]; then
            case "${LIMIT}" in
              minecraft) lock='linux_servers' ;;
              *)         lock="${LIMIT}" ;;
            esac
            matrix="$(jq -cn --arg p "${PLAYBOOK}" --arg l "${LIMIT}" --arg k "${lock}" \
              '[{playbook: $p, limit: $l, lock: $k}]')"
          else
            matrix="$(jq -cn '[
              {playbook: "openclaw.yml",  limit: "openclaw",      lock: "openclaw"},
              {playbook: "linux.yml",     limit: "linux_servers", lock: "linux_servers"},
              {playbook: "minecraft.yml", limit: "minecraft",     lock: "linux_servers"}
            ]')"
          fi
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "Targets: ${matrix}"

  ansible:
    needs: 'targets'
    name: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
          && 'Apply' || 'Check' }} ${{ matrix.target.limit }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45

    strategy:
      # One target failing must not cancel the sweep of the others — a broken
      # openclaw converge should still leave a usable drift signal for the linux
      # servers.
      fail-fast: false
      matrix:
        target: '${{ fromJSON(needs.targets.outputs.matrix) }}'

    # Keyed per lock rather than globally, so the drift sweep can cover
    # non-overlapping groups in parallel while still never letting two runs hit
    # the *same* hosts at once, and never cancelling one mid-flight — a
    # half-applied converge is worse than a queued one.
    #
    # check and apply deliberately share a group for a given target: separate
    # ones would let a drift check and a converge run against the same host
    # simultaneously, which is the thing this prevents. The cost is that GitHub
    # keeps at most one *pending* run per group, so a newly queued run can
    # cancel an apply still sitting at the approval prompt. That is fail-safe —
    # the cancelled run was never approved and never touched the server.
    # Re-dispatch it. See docs/ci-ansible.md §5.
    concurrency:
      # Keyed on `lock`, not `limit` — see the targets job for why they differ.
      group: 'ansible-deploy-${{ matrix.target.lock }}'
      cancel-in-progress: false

    # The approval gate. `claw-check` should have no protection rules;
    # `claw-production` should require a reviewer and restrict deployment
    # branches to `main`. See docs/ci-ansible.md.
    environment: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply')
          && 'claw-production' || 'claw-check' }}

    env:
      # Inputs are surfaced as environment variables rather than interpolated
      # into `run:` bodies: a `${{ }}` inside a shell script is a template
      # injection sink, and free-text inputs (limit/tags) are attacker-shaped
      # even when the attacker is a tired maintainer.
      PLAYBOOK: '${{ matrix.target.playbook }}'
      MODE: "${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || 'check' }}"
      LIMIT: '${{ matrix.target.limit }}'
      TAGS: '${{ inputs.tags }}'
      SKIP_TAGS: '${{ inputs.skip_tags }}'
      VERBOSITY: '${{ inputs.verbosity }}'

      # ansible.cfg sets `[diff] always = True`, which is right on a laptop and
      # wrong in a public log. Opt in per run.
      ANSIBLE_DIFF_ALWAYS: "${{ inputs.diff && 'true' || 'false' }}"

      ANSIBLE_FORCE_COLOR: '1'
      PY_COLORS: '1'
      # Per-task timings make a slow converge diagnosable from the log alone.
      ANSIBLE_CALLBACKS_ENABLED: 'ansible.posix.profile_tasks'

      # No ANSIBLE_VAULT_PASSWORD_FILE / ANSIBLE_VAULT_IDENTITY_LIST anywhere in
      # this workflow: 'Materialise credentials' writes the password to the exact
      # path ansible.cfg already names, so no override is needed.

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # ratchet:actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Redirect the Ansible log out of the workspace'
        # ansible/ansible.cfg sets `log_path = ../log/ansible.log`, which every
        # ansible command honours — not just ansible-playbook. Setting this on
        # the 'Run Ansible' step alone left the host-pinning gate's
        # `ansible-inventory` call writing $GITHUB_WORKSPACE/log/ansible.log,
        # contradicting the "nothing is written into the workspace" invariant
        # and quietly becoming a real leak the moment a group_vars file with
        # !vault values exists. Exported here so it covers every later step.
        run: 'echo "ANSIBLE_LOG_PATH=${RUNNER_TEMP}/ansible.log" >> "${GITHUB_ENV}"'

      - name: 'Set up uv'
        uses: 'astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d' # ratchet:astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: 'Install pinned Python toolchain'
        run: 'uv sync --locked'

      - name: 'Restore Ansible collections cache'
        uses: 'actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9' # ratchet:actions/cache@v6
        with:
          path: '~/.ansible/collections'
          # No `restore-keys:` on purpose. A prefix fallback would restore an
          # older cache on a key miss, and `ansible-galaxy collection install`
          # then reports "already installed" and does nothing — so the effective
          # collection versions would be whatever was resolved when the cache
          # was first populated, and editing requirements.yml would not change
          # them. An exact-key-only cache means a requirements change is a cache
          # miss and a genuine reinstall.
          key: "ansible-collections-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml', 'uv.lock') }}"

      - name: 'Install Ansible collections'
        run: 'uv run ansible-galaxy collection install --requirements-file ansible/requirements.yml'

      # Deliberately ahead of the host-pinning gate: that gate shells out to
      # `ansible-inventory`, which refuses to start when the vault password file
      # named in ansible.cfg is absent. Writing the credentials does not open any
      # connection, so nothing is reachable until the gate has passed.
      - name: 'Materialise credentials'
        env:
          CI_SSH_PRIVATE_KEY: '${{ secrets.CI_SSH_PRIVATE_KEY }}'
          ANSIBLE_VAULT_PASSWORD: '${{ secrets.ANSIBLE_VAULT_PASSWORD }}'
        # Never the workspace: nothing here can be picked up by a later
        # `actions/upload-artifact` or committed by accident.
        #
        # The vault password goes to ~/.ansible-personal-key specifically, not
        # to $RUNNER_TEMP. That exact path is this repository's convention —
        # ansible.cfg, README.md, AGENTS.md and docs/openclaw.md all name it —
        # and openclaw_setup/templates/secrets.env.j2 reads it *directly*:
        #
        #   ANSIBLE_VAULT_PASSWORD="{{ lookup('file', '~/.ansible-personal-key') | trim }}"
        #
        # A controller-side lookup like that bypasses ANSIBLE_VAULT_PASSWORD_FILE
        # entirely, so pointing env vars at a temp file was not enough: the run
        # got 80 tasks in and then failed on "Deploy OpenClaw secrets
        # environment file". Honouring the convention makes ansible.cfg's
        # vault_password_file, its vault_identity_list and that lookup all
        # resolve with no overrides at all.
        run: |
          set -euo pipefail
          umask 077

          if [ -z "${CI_SSH_PRIVATE_KEY}" ]; then
            echo "::error::Secret CI_SSH_PRIVATE_KEY is not set. See docs/ci-ansible.md."
            exit 1
          fi
          if [ -z "${ANSIBLE_VAULT_PASSWORD}" ]; then
            echo "::error::Secret ANSIBLE_VAULT_PASSWORD is not set. See docs/ci-ansible.md."
            exit 1
          fi

          printf '%s\n' "${CI_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/ci_ssh_key"

          # $RUNNER_TEMP is guaranteed job-scoped; $HOME is not. On a self-hosted
          # or reused runner the 'Shred credentials' step would otherwise destroy
          # the real vault key of whoever owns that machine, unrecoverably. Fail
          # instead of overwriting — a no-op on ubuntu-latest.
          if [ -e "${HOME}/.ansible-personal-key" ]; then
            echo "::error::${HOME}/.ansible-personal-key already exists; this job shreds that path and will not overwrite a pre-existing key."
            exit 1
          fi
          printf '%s\n' "${ANSIBLE_VAULT_PASSWORD}" > "${HOME}/.ansible-personal-key"
          chmod 600 "${RUNNER_TEMP}/ci_ssh_key" "${HOME}/.ansible-personal-key"

          # Fail here with a clear message rather than as an opaque UNREACHABLE
          # 90 seconds later, e.g. when the secret was pasted without its
          # trailing newline or with the PEM header mangled.
          if ! ssh-keygen -y -f "${RUNNER_TEMP}/ci_ssh_key" > /dev/null 2>&1; then
            echo "::error::CI_SSH_PRIVATE_KEY is not a valid, unencrypted private key."
            exit 1
          fi

          # No ANSIBLE_VAULT_PASSWORD_FILE / ANSIBLE_VAULT_IDENTITY_LIST
          # overrides any more: with the file at the conventional path,
          # ansible.cfg's own `vault_password_file` and
          # `vault_identity_list = personal@~/.ansible-personal-key` already
          # resolve, and one fewer override means one fewer thing that can
          # disagree with a controller-side lookup.
          #
          # This step still has to run *before* the host-pinning gate: any
          # ansible command, including that gate's `ansible-inventory` call,
          # aborts when the vault password file named in ansible.cfg is missing.

      - name: 'Refuse to target hosts without a pinned SSH host key'
        working-directory: 'ansible'
        # This is the blast-radius control. `--limit` is free text, and a typo
        # or a paste error could otherwise aim a converge at every host in the
        # inventory. Resolving the pattern first and requiring each resulting
        # host to be pinned in known_hosts means CI can only ever reach hosts
        # whose identity has been reviewed into the repository.
        run: |
          set -euo pipefail

          if ! hosts="$(uv run ansible-inventory --list --limit "${LIMIT}" | jq -r '._meta.hostvars | keys[]')"; then
            echo "::error::Could not resolve --limit '${LIMIT}' against the inventory."
            exit 1
          fi

          if [ -z "${hosts}" ]; then
            echo "::error::--limit '${LIMIT}' matches no hosts. Refusing to run."
            exit 1
          fi

          unpinned=0
          while read -r host; do
            if ssh-keygen -F "${host}" -f known_hosts > /dev/null 2>&1; then
              echo "✓ ${host} (host key pinned)"
            else
              printf '::error file=ansible/known_hosts::%s%s\n' \
                "'${host}' has no pinned SSH host key. " \
                "Add one with: ssh-keyscan -t ed25519,ecdsa,rsa ${host} >> ansible/known_hosts"
              unpinned=1
            fi
          done <<< "${hosts}"

          if [ "${unpinned}" -ne 0 ]; then
            echo "::error::Refusing to deploy: at least one target host is not pinned."
            exit 1
          fi

          {
            echo "TARGET_HOSTS<<EOF"
            echo "${hosts}"
            echo "EOF"
          } >> "${GITHUB_ENV}"

      - name: 'Show run plan'
        run: |
          set -euo pipefail
          {
            echo "### Ansible ${MODE} — \`${LIMIT}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Playbook | \`${PLAYBOOK}\` |"
            echo "| Mode | \`${MODE}\` |"
            echo "| Limit | \`${LIMIT}\` |"
            echo "| Tags | \`${TAGS:-<all>}\` |"
            echo "| Skip tags | \`${SKIP_TAGS:-<none>}\` |"
            echo "| Diff | \`${ANSIBLE_DIFF_ALWAYS}\` |"
            echo "| Ref | \`${GITHUB_REF_NAME}\` @ \`${GITHUB_SHA:0:8}\` |"
            echo "| Trigger | \`${GITHUB_EVENT_NAME}\` |"
            echo
            echo "Targets:"
            echo '```'
            echo "${TARGET_HOSTS}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 'Run Ansible'
        working-directory: 'ansible'
        env:
          ANSIBLE_PRIVATE_KEY_FILE: '${{ runner.temp }}/ci_ssh_key'
          ANSIBLE_HOST_KEY_CHECKING: 'True'
          # SSH_COMMON_ARGS rather than SSH_ARGS so ansible.cfg's ControlMaster
          # settings survive. IdentitiesOnly stops ssh from offering any other
          # key it happens to find and tripping MaxAuthTries.
          ANSIBLE_SSH_COMMON_ARGS: >-
            -o UserKnownHostsFile=${{ github.workspace }}/ansible/known_hosts
            -o StrictHostKeyChecking=yes
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o ConnectTimeout=15
        run: |
          set -euo pipefail
          # umask does not carry across steps. Without it the tee'd log and
          # ansible's own log land at 0644 while holding full task output —
          # which is exactly what carries rendered template contents when diff
          # is on.
          umask 077

          args=( "playbooks/${PLAYBOOK}" --limit "${LIMIT}" )

          if [ "${MODE}" = 'check' ]; then
            args+=( --check )
          fi
          if [ -n "${TAGS}" ]; then
            args+=( --tags "${TAGS}" )
          fi
          if [ -n "${SKIP_TAGS}" ]; then
            args+=( --skip-tags "${SKIP_TAGS}" )
          fi
          if [ -n "${VERBOSITY}" ] && [ "${VERBOSITY}" != 'default' ]; then
            args+=( "${VERBOSITY}" )
          fi

          echo "Running: ansible-playbook ${args[*]}"

          # tee'd so the next step can lift PLAY RECAP into the job summary.
          # `set -o pipefail` above keeps ansible's exit status, not tee's.
          uv run ansible-playbook "${args[@]}" | tee "${RUNNER_TEMP}/ansible-stdout.log"

      - name: 'Summarise the play recap'
        if: always()
        # The job summary is a separate page from the job log, so telling the
        # reader to "see the recap above" pointed at nothing. Ansible's PLAY
        # RECAP is lifted in here instead, so the summary answers "what would
        # change?" on its own.
        #
        # Only the recap line is copied — hostnames and counters. Task output,
        # which is what could carry vault-decrypted values when diff is on, is
        # never read out of the log.
        run: |
          set -euo pipefail

          log="${RUNNER_TEMP}/ansible-stdout.log"
          if [ ! -s "${log}" ]; then
            echo "_No play recap: Ansible produced no output (it failed before the play started)._" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # ansible writes ANSI colour even through a pipe because of
          # ANSIBLE_FORCE_COLOR; strip it before parsing.
          recap="$(sed 's/\x1b\[[0-9;]*m//g' "${log}" | grep -E '^[^ ]+ +: +ok=' || true)"

          if [ -z "${recap}" ]; then
            echo "_No play recap: the run ended before Ansible printed one._" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          {
            echo
            if [ "${MODE}" = 'check' ]; then
              echo "### Pending changes (check mode — nothing was applied)"
            else
              echo "### Applied"
            fi
            echo
            echo "| Host | ok | changed | unreachable | failed | skipped | rescued | ignored |"
            echo "|---|---|---|---|---|---|---|---|"
            # The ANSI-stripped recap is whitespace-separated (ansible's
            # colorize() emits '%s=%-4s'), so `read` splits it directly — no
            # per-field subprocesses, and a here-string avoids the pipeline
            # subshell. The bare `_` swallows the ':' separator.
            #
            # `ignored` is carried because a non-zero value is precisely the
            # "green run that was not actually clean" case, which the summary is
            # meant to answer on its own.
            while read -r host _ ok changed unreachable failed skipped rescued ignored; do
              printf '| `%s` | %s | **%s** | %s | %s | %s | %s | %s |\n' \
                "${host}" "${ok#ok=}" "${changed#changed=}" \
                "${unreachable#unreachable=}" "${failed#failed=}" \
                "${skipped#skipped=}" "${rescued#rescued=}" "${ignored#ignored=}"
            done <<< "${recap}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 'Record success'
        if: success()
        run: |
          set -euo pipefail
          if [ "${MODE}" = 'check' ]; then
            {
              echo
              echo "✅ Check completed. A non-zero \`changed\` above is a *pending* change:"
              echo "the repository and the server have diverged. Nothing was applied."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo
              echo "✅ Applied to \`${LIMIT}\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: 'Record failure'
        if: failure()
        run: |
          {
            echo
            echo "❌ Run failed. Note that not every task is check-mode safe, so a red"
            echo "*check* run does not always mean real drift."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 'Shred credentials'
        if: always()
        run: |
          # ansible-stdout.log holds full task output, which carries rendered
          # template contents when diff is on — same handling as the key material.
          shred --remove --force \
            "${RUNNER_TEMP}/ci_ssh_key" \
            "${HOME}/.ansible-personal-key" \
            "${RUNNER_TEMP}/ansible.log" \
            "${RUNNER_TEMP}/ansible-stdout.log" 2> /dev/null || true
          rm -f "${RUNNER_TEMP}/ci_ssh_key" "${HOME}/.ansible-personal-key" \
                "${RUNNER_TEMP}/ansible.log" "${RUNNER_TEMP}/ansible-stdout.log"
