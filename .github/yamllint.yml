# Single source of truth for YAML style, used by both the yamllint pre-commit
# hook and the `✅ Ansible CI` workflow — so a clean `pre-commit run` means a
# green CI run. Previously this ruleset existed only as an inline `-d '{...}'`
# argument in .pre-commit-config.yaml, which CI could not reuse.
#
# Deliberately NOT at the repository root as `.yamllint`: ansible-lint embeds
# its own yamllint and auto-discovers a root config, so putting it there makes
# ansible-lint start failing on pre-existing long lines in the roles. Keeping it
# here leaves ansible-lint on its own defaults, exactly as before.
# Both callers pass it explicitly with `-c .github/yamllint.yml`.
extends: relaxed

rules:
  line-length:
    max: 120

# CI runs yamllint across the whole repository, which would otherwise walk into
# vendored and generated trees — .venv alone holds ~5000 YAML files.
ignore: |
  .venv/
  .idea/
  **/.terraform/
  log/
  ansible/roles/microk8s/files/
