---

- name: "Deploy Laptop"
  hosts: laptops

  vars_files:
    - ../vars/laptop.yml
  vars:
    iterm2_integration_users:
      - name: "Main account"
        home_path: "{{ ansible_facts['user_dir'] }}"
        owner: "{{ ansible_facts['user_id'] }}"
        group: "{{ ansible_facts['user_gid'] }}"
  # Homebrew is not on Ansible's minimal command/shell PATH. Prepend both prefixes
  # so tasks that shell out to `brew`, `helm`, etc. resolve regardless of the
  # invoking shell (Apple Silicon uses /opt/homebrew, Intel /usr/local).
  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_facts['env']['PATH'] }}"
  roles:
    - role: laptop_setup
      tags: deploy
    - role: iterm2_integration
      tags: iterm2
  become: false
