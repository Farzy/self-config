---

# quassel.farzy.org, and only quassel.farzy.org.
#
# One playbook per server is deliberate: the deploy workflow picks a playbook
# and nothing else, so the playbook's own `hosts:` is the only thing that
# decides which machine is touched. There is no --limit to get wrong.
- name: "Deploy quassel"
  hosts: quassel

  roles:
    # `setup`, matching openclaw.yml. These two carried `deploy`, inherited
    # from the old linux.yml, so `--tags deploy` from the dispatch form meant
    # "base OS config" on two servers and nothing at all on the third.
    - role: master_setup
      tags: setup
    - role: iterm2_integration
      tags: iterm2

  vars:
    master_setup_unattended_third_party: true
    # Password logins are off: only public keys (the operator's, and the CI
    # deploy key below). quassel is the most attacked host and, unlike claw and
    # minecraft-01, still accepted passwords.
    master_setup_sshd_password_auth: false
    # ~26k scan attempts a day fill sshd's unauthenticated-connection slots
    # (default LoginGraceTime 120 / MaxStartups 10:30:100) and it then drops every
    # new connection, the operator's and CI's included.
    master_setup_sshd_login_grace_time: 20
    master_setup_sshd_max_startups: "30:30:200"
    iterm2_integration_users:
      - { name: "root", home_path: "/root", owner: "root", group: "root" }
      - { name: "debian", home_path: "/home/debian", owner: "debian", group: "debian" }

    # Public SSH key GitHub Actions authenticates with, installed for the
    # `debian` account (the inventory's `ansible_user`). Public keys are not
    # secrets, so this is deliberately unencrypted — the private half lives only
    # in the repository secret CI_SSH_PRIVATE_KEY. Same key as
    # vars/openclaw.yml; see docs/ci-ansible.md §7.
    #
    # Fingerprint: SHA256:DMb6MJpuE2Yumm52pGtydezEffHjNe7RALZL/CfwGTI (ED25519)
    master_setup_ci_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF9YfG+nqsaWqTXsGA39w48vSgaoSeu7rRS7TL80e4vF github-actions@self-config"
