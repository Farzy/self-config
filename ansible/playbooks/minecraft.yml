---

# minecraft-01.farzad.tech, and only minecraft-01.farzad.tech: base OS config
# and the Minecraft game servers.
#
# One playbook per server is deliberate: the deploy workflow picks a playbook
# and nothing else, so the playbook's own `hosts:` is the only thing that
# decides which machine is touched. There is no --limit to get wrong, and no
# playbook spans two servers — this host used to also be reached by linux.yml
# via the linux_servers group, which made it possible for two CI jobs to
# converge it at once.
- name: "Deploy minecraft-01"
  hosts: minecraft
  become: true

  vars_files:
    - ../vars/minecraft.yml

  vars:
    iterm2_integration_users:
      - { name: "root", home_path: "/root", owner: "root", group: "root" }
      - { name: "debian", home_path: "/home/debian", owner: "debian", group: "debian" }

    master_setup_ci_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF9YfG+nqsaWqTXsGA39w48vSgaoSeu7rRS7TL80e4vF github-actions@self-config"

    minecraft_server_instances:
      - name: mc01
        port: 25565
        motd: "Serveur Minecraft de Farzad"
        rcon_password: "{{ minecraft_mc01_rcon_password }}"
        whitelist: "{{ minecraft_mc01_whitelist }}"
        ops: "{{ minecraft_mc01_ops }}"
      - name: mc02
        port: 25566
        motd: "Faustine's own Minecraft world"
        rcon_password: "{{ minecraft_mc02_rcon_password }}"
        whitelist: "{{ minecraft_mc02_whitelist }}"
        ops: "{{ minecraft_mc02_ops }}"

  roles:
    - role: master_setup
      tags: deploy
    - role: iterm2_integration
      tags: iterm2

    # Docker itself is IaC too: the host was built by hand with Docker's own
    # repository, and without this the container runtime was the one part of
    # the stack a rebuild would not reproduce.
    #
    # `docker_sysctl_settings: []` because the defaults raise inotify limits for
    # kind/microk8s, which two Minecraft servers do not need — no reason to
    # retune the kernel of a running game host.
    - role: docker
      tags: docker
      vars:
        docker_sysctl_settings: []
        docker_packages:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          # Not a dependency of docker-ce, and this deployment is entirely
          # `docker compose`.
          - docker-compose-plugin
        docker_admin_users:
          - "{{ minecraft_server_user }}"

    - role: minecraft_server
      tags: minecraft
