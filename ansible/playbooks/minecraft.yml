---

# The Minecraft game servers on minecraft-01.farzad.tech.
#
# Base OS configuration for this host comes from playbooks/linux.yml, which
# targets it as a member of linux_servers. This playbook layers only the game
# servers on top, so the two can be run independently.
- name: "Deploy Minecraft servers"
  hosts: minecraft
  become: true

  vars_files:
    - ../vars/minecraft.yml

  vars:
    minecraft_server_instances:
      - name: mc01
        port: 25565
        motd: "Serveur Minecraft de Farzad"
        rcon_password: "{{ minecraft_mc01_rcon_password }}"
        whitelist: "{{ minecraft_mc01_whitelist }}"
        ops: "{{ minecraft_mc01_ops }}"
      - name: mc02
        port: 25566
        motd: "Faustine's own Minecraft world"
        rcon_password: "{{ minecraft_mc02_rcon_password }}"
        whitelist: "{{ minecraft_mc02_whitelist }}"
        ops: "{{ minecraft_mc02_ops }}"

  roles:
    # Docker itself is IaC too: the host was built by hand with Docker's own
    # repository, and without this the container runtime was the one part of
    # the stack a rebuild would not reproduce.
    #
    # `docker_sysctl_settings: []` because the defaults raise inotify limits for
    # kind/microk8s, which two Minecraft servers do not need — no reason to
    # retune the kernel of a running game host.
    - role: docker
      tags: docker
      vars:
        docker_sysctl_settings: []
        docker_packages:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          # Not a dependency of docker-ce, and this deployment is entirely
          # `docker compose`.
          - docker-compose-plugin
        docker_admin_users:
          - "{{ minecraft_server_user }}"

    - role: minecraft_server
      tags: minecraft
