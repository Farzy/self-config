---
- name: Deploy OpenClaw
  hosts: openclaw
  become: true
  vars_files:
    - ../vars/openclaw.yml
  vars:
    master_setup_unattended_third_party: true
    # Keep scanners from exhausting sshd's unauthenticated-connection slots (see
    # master_setup/defaults/main.yml).
    master_setup_sshd_login_grace_time: 20
    master_setup_sshd_max_startups: "30:30:200"
    iterm2_integration_users:
      - { name: "root", home_path: "/root", owner: "root", group: "root" }
      - { name: "debian", home_path: "/home/debian", owner: "debian", group: "debian" }
      - { name: "claw", home_path: "/home/claw", owner: "claw", group: "claw" }
  roles:
    - role: master_setup
      tags: setup
    - role: fastmail_mcp_setup
      tags: fastmail_mcp
    - role: openclaw_setup
      tags: openclaw
    - role: iterm2_integration
      tags: iterm2
