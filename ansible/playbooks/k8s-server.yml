---

- name: "Install server"
  hosts: k8s

  roles:
    - role: master_setup
      tags: deploy
    - role: docker
      tags: docker
    - role: kubectl
      tags: kubectl
    - role: kind
      tags: kind
#    - role: minikube
#      tags: minikube
    - role: microk8s
      tags: microk8s
      when: master_setup_install_microk8s
  vars:
    default_user: debian
    # Previously the docker role hardcoded `{{ user_owner }}`, which is defined
    # nowhere in this repository — so its final task failed with
    # "'user_owner' is undefined". Naming the account here restores the intent.
    docker_admin_users:
      - debian
    master_setup_install_microk8s: true
    # Check https://kind.sigs.k8s.io/docs/user/configuration/
    kind_configs:
      multi: |
        # Multi-nodes cluster
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
          - role: control-plane
            labels:
              role: cp
          - role: worker
            labels:
              role: worker1
          - role: worker
            labels:
              role: worker2
        networking:
          #apiServerAddress: "{{ ansible_facts['default_ipv4']['address'] }}"
          apiServerPort: 1443
      training: |
        # Training cluster
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
          - role: control-plane
        networking:
          apiServerAddress: "{{ ansible_facts['default_ipv4']['address'] }}"
          apiServerPort: 10443
