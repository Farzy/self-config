---

- name: "Install server"
  hosts: k8s

  pre_tasks:
    # Debian 11 (bullseye) is past LTS: its -backports suite has been removed from
    # the mirrors, so `apt-get update` fails ("no longer has a Release file") and,
    # with it, every apt task with update_cache in the roles below. The main and
    # security suites are still served. Drop this once the host is on a supported
    # release.
    - name: Disable the bullseye-backports repository (no longer on the mirrors)
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '^(deb(?:-src)? http://deb\.debian\.org/debian bullseye-backports main)$'
        replace: '# disabled: repository no longer has a Release file: \1'
        backup: true
      when: ansible_facts['distribution_release'] == 'bullseye'
      tags: always

  roles:
    - role: master_setup
      tags: deploy
    - role: docker
      tags: docker
    - role: kubectl
      tags: kubectl
    - role: kind
      tags: kind
#    - role: minikube
#      tags: minikube
    - role: microk8s
      tags: microk8s
      when: master_setup_install_microk8s
  vars:
    # Opted out of both: this host runs a multi-node KinD cluster, which does not
    # survive a dockerd restart or a reboot on its own (kind#2775, kind#1689, see
    # README.md § References), and nobody is around at night to recreate it.
    # Debian security upgrades still apply; the reboot stays manual.
    master_setup_unattended_third_party: false
    master_setup_unattended_auto_reboot: false
    # Keep scanners from exhausting sshd's unauthenticated-connection slots (see
    # master_setup/defaults/main.yml).
    master_setup_sshd_login_grace_time: 20
    master_setup_sshd_max_startups: "30:30:200"
    default_user: debian
    # Previously the docker role hardcoded `{{ user_owner }}`, which is defined
    # nowhere in this repository — so its final task failed with
    # "'user_owner' is undefined". Naming the account here restores the intent.
    docker_admin_users:
      - debian
    master_setup_install_microk8s: true
    # Check https://kind.sigs.k8s.io/docs/user/configuration/
    kind_configs:
      multi: |
        # Multi-nodes cluster
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
          - role: control-plane
            labels:
              role: cp
          - role: worker
            labels:
              role: worker1
          - role: worker
            labels:
              role: worker2
        networking:
          #apiServerAddress: "{{ ansible_facts['default_ipv4']['address'] }}"
          apiServerPort: 1443
      training: |
        # Training cluster
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        nodes:
          - role: control-plane
        networking:
          apiServerAddress: "{{ ansible_facts['default_ipv4']['address'] }}"
          apiServerPort: 10443
