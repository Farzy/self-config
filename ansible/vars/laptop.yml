laptop_serial_professional: "FTV32FH396"

integration_personal_laptop: "{{ (system_serial_number | default('')) == laptop_serial_personal }}"
integration_market_pay: "{{ (system_serial_number | default('')) == laptop_serial_professional }}"

# Shared between the CLAUDE.md check/install tasks in laptop_setup, so all
# of them stay in lockstep with the real installer. Neither CLAUDE.md variant
# is ever overwritten by a normal apply -- see the "ai-claude-write" tag in
# roles/laptop_setup/tasks/main.yml.
claude_md_dest: "~/.claude/CLAUDE.md"
claude_md_mode: "0644"

laptop_hostname: >-
  {% if (system_serial_number | default('')) == laptop_serial_personal %}
  Serenity
  {% elif (system_serial_number | default('')) == laptop_serial_professional %}
  FRMPTMACFH396
  {% else %}
  {{ ansible_facts['hostname'] }}
  {% endif %}

is_macos: "{{ ansible_facts['os_family'] == 'Darwin' }}"
# homebrew_prefix (/opt/homebrew on Apple Silicon, /usr/local on Intel) is set as
# a fact in roles/laptop_setup/tasks/main.yml from `brew --prefix` -- NOT derived
# from ansible_facts['architecture'], which reports x86_64 whenever Ansible's
# Python interpreter is an Intel build running under Rosetta.
is_debian_family: "{{ ansible_facts['os_family'] == 'Debian' }}"
is_debian: "{{ ansible_facts['distribution'] == 'Debian' }}"
is_ubuntu: "{{ ansible_facts['distribution'] == 'Ubuntu' }}"
is_wsl2: "{{ ansible_facts['virtualization_type'] == 'wsl' }}"
