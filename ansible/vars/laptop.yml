# Safety gate for the "Install personal CLAUDE.md" task: CLAUDE_personal.md.j2
# started out as a placeholder, not the real content of Delerium's
# ~/.claude/CLAUDE.md. It has since been seeded with the real content and
# verified with the "ai-drift" trace tag (zero diff), so a normal apply can
# now manage the file going forward.
claude_personal_md_ready: true

# Shared between the CLAUDE.md install and "ai-drift" trace tasks in
# laptop_setup, so both variants stay in lockstep with the real installer.
claude_md_dest: "~/.claude/CLAUDE.md"
claude_md_mode: "0644"

