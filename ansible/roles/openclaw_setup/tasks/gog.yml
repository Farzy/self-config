---
# gog (Google Workspace CLI) install. Its OAuth authorization is in gog-auth.yml,
# which runs after secrets-env.yml. See docs/openclaw.md §6.6.

- name: "Check if gog CLI is installed: {{ openclaw_setup_gog_cli_version }}"
  ansible.builtin.stat:
    path: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}/gog"
  register: openclaw_setup_gog_cli_stat

- name: Download gog CLI release archive (Linux amd64)
  ansible.builtin.get_url:
    url: >-
      https://github.com/openclaw/gogcli/releases/download/v{{
      openclaw_setup_gog_cli_version }}/gogcli_{{
      openclaw_setup_gog_cli_version }}_linux_amd64.tar.gz
    dest: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ openclaw_setup_gog_cli_sha256 }}"
    mode: '0644'
  when: not openclaw_setup_gog_cli_stat.stat.exists

# Not conditional on the stat: gogcli archives (seen in 0.47.0) can ship their "./"
# entry as 0700, which tar applies to this directory and leaves gog unreadable for
# the claw user. Enforcing the mode on every run also repairs an affected host.
- name: Create gog CLI install directory
  ansible.builtin.file:
    path: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}"
    state: directory
    mode: '0755'

- name: Extract gog CLI
  ansible.builtin.unarchive:
    src: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    dest: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}"
    remote_src: true
    # Keep the 0755 directory above instead of the mode of the archive's "./" entry.
    extra_opts:
      - --no-overwrite-dir
  # The directory above is only created for real, so check mode has nothing to extract into.
  when:
    - not openclaw_setup_gog_cli_stat.stat.exists
    - not ansible_check_mode

- name: Remove downloaded gog CLI archive
  ansible.builtin.file:
    path: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    state: absent

- name: Symlink gog CLI to /usr/local/bin
  ansible.builtin.file:
    src: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}/gog"
    dest: /usr/local/bin/gog
    state: link
    force: true
