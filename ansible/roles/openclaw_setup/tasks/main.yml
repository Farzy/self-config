---
# The role is split by concern; each file keeps the order the tasks ran in when
# this was one file. Ordering that matters is documented where it applies:
# secrets.env before anything that runs the OpenClaw CLI, the credential stores
# before openclaw.json is rendered, and the audit gate after it.

- name: Provision the openclaw service account
  ansible.builtin.import_tasks: user.yml

- name: Install host packages and APT sources
  ansible.builtin.import_tasks: packages.yml

- name: Install signal-cli
  ansible.builtin.import_tasks: signal-cli.yml

- name: Install and authorize the gog CLI
  ansible.builtin.import_tasks: gog.yml

- name: Deploy the OpenClaw secrets environment file
  ansible.builtin.import_tasks: secrets-env.yml

- name: Install OpenClaw
  ansible.builtin.import_tasks: install.yml

- name: Keep OpenClaw's credential stores reference-only
  ansible.builtin.import_tasks: credential-stores.yml

- name: Deploy openclaw.json and audit the credential stores
  ansible.builtin.import_tasks: config.yml

- name: Deploy the OpenClaw gateway service
  ansible.builtin.import_tasks: service.yml

- name: Deploy the nginx reverse proxy
  ansible.builtin.import_tasks: nginx.yml

- name: Start the OpenClaw gateway
  ansible.builtin.import_tasks: gateway.yml

- name: Provision agent skills
  ansible.builtin.import_tasks: skills.yml
