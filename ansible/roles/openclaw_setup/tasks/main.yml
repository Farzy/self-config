---
- name: Create openclaw group
  ansible.builtin.group:
    name: "{{ openclaw_setup_group }}"
    state: present

- name: Create openclaw user
  ansible.builtin.user:
    name: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    home: "{{ openclaw_setup_home }}"
    shell: /usr/bin/zsh
    state: present
  register: openclaw_setup_user_result

# The gateway runs under this user's systemd manager, reached through
# /run/user/<uid>; every user-scope task and handler needs the numeric uid.
# Empty in a --check run against a host where the user does not exist yet (the
# user module then reports no uid); every consumer is skipped there anyway,
# since the user unit cannot be in place either.
- name: Record the openclaw user's uid for its systemd user manager
  ansible.builtin.set_fact:
    openclaw_setup_uid: "{{ openclaw_setup_user_result.uid | default('') }}"

- name: Deploy SSH authorized key for openclaw user
  ansible.posix.authorized_key:
    user: "{{ openclaw_setup_user }}"
    state: present
    key: "{{ openclaw_setup_ssh_key }}"
  when: openclaw_setup_ssh_key | length > 0

- name: Remove any sudoers configuration for openclaw user
  ansible.builtin.file:

    path: "/etc/sudoers.d/{{ openclaw_setup_user }}"
    state: absent

# Deliberate, scoped grant (a documented exception to the privileged-groups
# deny-list asserted below): lets the openclaw user run `journalctl -u <service>`
# to debug services like fastmail-mcp without sudo. NOTE: systemd-journal grants
# read access to the FULL system journal (all units, including sshd/PAM auth
# events, sudo invocations and kernel messages) — on this journald host that is
# largely the same content `adm` would expose. Accepted trade-off to avoid
# granting sudo or `adm`. Placed before the group snapshot so the deny-list
# assertion validates the state the role actually converges to.
#
# Notifies the user-manager restart, not the gateway restart: supplementary
# groups are fixed when user@<uid>.service starts, so restarting only the unit
# would not pick up the new group.
- name: Add openclaw user to systemd-journal group for read-only journal access
  ansible.builtin.user:
    name: "{{ openclaw_setup_user }}"
    groups: systemd-journal
    append: true
  notify: Restart openclaw user manager

- name: Get active groups for openclaw user
  ansible.builtin.command:
    cmd: "id -Gn {{ openclaw_setup_user }}"
  register: openclaw_setup_user_groups_cmd
  changed_when: false
  check_mode: false

- name: Assert openclaw user is not a member of privileged groups
  ansible.builtin.assert:
    that:
      - "'sudo' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'root' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'wheel' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'shadow' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'adm' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'disk' not in openclaw_setup_user_groups_cmd.stdout.split()"
    fail_msg: "SECURITY VIOLATION: User {{ openclaw_setup_user }} belongs to a privileged group! Groups: {{ openclaw_setup_user_groups_cmd.stdout }}"
    success_msg: "Security assertion passed: User {{ openclaw_setup_user }} is not a member of any privileged groups."

- name: Check sudo privilege status for openclaw user
  ansible.builtin.command:
    cmd: "sudo -n -l -U {{ openclaw_setup_user }}"
  register: openclaw_setup_sudo_check
  changed_when: false
  failed_when: false
  check_mode: false


- name: Assert openclaw user has no sudo privileges
  ansible.builtin.assert:
    that:
      - >-
        openclaw_setup_sudo_check.rc != 0 or
        'not allowed to run sudo' in openclaw_setup_sudo_check.stderr or
        'not allowed to run sudo' in openclaw_setup_sudo_check.stdout
    fail_msg: "SECURITY VIOLATION: User {{ openclaw_setup_user }} has sudo privileges on this system!"
    success_msg: "Security assertion passed: User {{ openclaw_setup_user }} has no sudo privileges."

- name: Test existence of Oh My Zsh for openclaw user

  ansible.builtin.stat:
    path: "{{ openclaw_setup_home }}/.oh-my-zsh"
  register: openclaw_setup_omz_stat

- name: Download OMZ installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/omz-install.sh
    mode: '0755'
  when: not openclaw_setup_omz_stat.stat.exists

- name: Run OMZ installation script for openclaw user
  ansible.builtin.command: /tmp/omz-install.sh --unattended --keep-zshrc
  when: not openclaw_setup_omz_stat.stat.exists
  changed_when: true
  become: true
  become_user: "{{ openclaw_setup_user }}"

- name: Install dotfiles for openclaw user
  ansible.builtin.template:
    src: "{{ role_path }}/../master_setup/templates/dotfiles/{{ item }}"
    dest: "{{ openclaw_setup_home }}/{{ item }}"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0644'
  loop:
    - .bashrc
    - .gitignore_global
    - .profile
    - .zshrc
    - .gitconfig

# Created as the openclaw user so any missing parents (~/.cache/openclaw) are
# owned by it too.
- name: Create compilation cache directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_compile_cache }}"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'
  become: true
  become_user: "{{ openclaw_setup_user }}"

# The gateway's TMPDIR (see openclaw_setup_tmp_dir): private to the user, and
# unlike PrivateTmp's /tmp it survives the service stop in the middle of an
# update.
- name: Create the OpenClaw gateway temporary directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_tmp_dir }}"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0700'
  become: true
  become_user: "{{ openclaw_setup_user }}"

# Superseded by the cache under $HOME above; the old path sat behind the unit's
# PrivateTmp and never reached the service anyway.
- name: Remove the legacy /var/tmp compile cache
  ansible.builtin.file:
    path: /var/tmp/openclaw-compile-cache
    state: absent

- name: Enable lingering for openclaw user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ openclaw_setup_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ openclaw_setup_user }}"

- name: Create systemd user configuration directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.config/systemd/user"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
      - curl
      - gnupg
      - ca-certificates
      - acl
      # Required on the managed node by ansible.builtin.deb822_repository,
      # which replaces the deprecated apt_key/apt_repository below. Note that on
      # a host that does not have it yet, a first `--check` run fails at the
      # repository tasks: check mode only simulates this install, so the module
      # still finds the library missing. That is expected, not a regression —
      # apply once, then --check works.
      - python3-debian
    state: present
    update_cache: true

- name: Allow HTTP and HTTPS in ufw firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

# --- One-shot migration cleanups -------------------------------------------
#
# These run *before* deb822_repository, not after. The module derives its
# keyring filename from `name` plus the fetched key's encoding — armored gives
# nodesource.asc, binary gives nodesource.gpg — so the orphan removal below
# targets a name the module itself can legitimately produce. Ordered after the
# module, the play would delete the keyring it had just installed the moment
# NodeSource served that key dearmored, and `Install Node.js` (update_cache)
# would fail with NO_PUBKEY, flapping on every run. A --check run cannot catch
# that, since nothing is written.

# apt_repository appends rather than replaces, so bumping the Node major left
# the previous release's line behind: on claw this file held both node_24.x and
# node_26.x, meaning apt could resolve nodejs from either. deb822_repository
# writes nodesource.sources instead, and apt would read both.
- name: Remove the superseded NodeSource .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent

- name: Remove the orphaned NodeSource keyring left by the old flow
  ansible.builtin.file:
    path: /etc/apt/keyrings/nodesource.gpg
    state: absent

# apt_key put the NodeSource key in /etc/apt/trusted.gpg, where it is trusted to
# sign *any* repository. That file is host-wide rather than role-scoped, so
# deleting it unconditionally would untrust whatever else has landed there —
# another host in this group, or an `apt-key add` between converges — and the
# damage would surface later as an apt signature error on an unrelated
# repository. The evidence is therefore re-checked on every run instead of being
# recorded in a comment.
#
# Matching on `pub:` records, not `fpr:`: gpg emits an fpr line per subkey too,
# so filtering fingerprints would leave the NodeSource *subkey*
# (0FA5ECC8C0CA58863C0AC5867E9656125E955B26) behind and the condition could
# never hold.
# The probe below must not run against a path that does not exist: `gpg
# --keyring <path>` *creates* an empty keyring (32 bytes) as a side effect. That
# turned the removal into a permanent churn loop — the probe recreated
# /etc/apt/trusted.gpg on every run and the next task deleted it again, so a
# converged host reported `changed` forever. Verified on claw: pointing gpg at a
# nonexistent path leaves a 32-byte file behind, exactly the size found there.
- name: Check whether the legacy globally-trusted apt keyring exists
  ansible.builtin.stat:
    path: /etc/apt/trusted.gpg
  register: openclaw_setup_legacy_trusted_stat

- name: Inspect the legacy globally-trusted apt keyring
  ansible.builtin.command:
    cmd: gpg --no-default-keyring --keyring /etc/apt/trusted.gpg --list-keys --with-colons
  when: openclaw_setup_legacy_trusted_stat.stat.exists
  register: openclaw_setup_legacy_trusted
  changed_when: false
  # Absent keyring, or no gpg, exits non-zero; that is a reason to leave the
  # file alone, not to fail the play.
  failed_when: false
  # Read-only, and it has to run during --check or the guard below would compare
  # against an empty stdout and delete on the strength of no evidence at all.
  check_mode: false

- name: Remove the legacy globally-trusted apt keyring
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg
    state: absent
  when:
    - openclaw_setup_legacy_trusted_stat.stat.exists
    - openclaw_setup_legacy_trusted.rc | default(1) == 0
    - openclaw_setup_legacy_trusted.stdout_lines | default([])
      | select('match', '^pub:')
      | reject('search', '2F59B5F99B1BE0B4')
      | list | length == 0

# --- End of one-shot migration cleanups ------------------------------------

# apt_key and apt_repository are both deprecated and removed in ansible-core
# 2.25. deb822_repository replaces the pair: it carries the signing key with the
# repository definition, so the key is scoped to this one source instead of
# being trusted for every repository on the host — which is the actual reason
# apt_key is going away.
#
# The module creates /etc/apt/keyrings itself when it needs to store a key
# (ensure_keyrings_dir), so it does not depend on the task further down that
# also creates it.
- name: Add NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: https://deb.nodesource.com/node_26.x
    suites: [nodistro]
    components: [main]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add GitHub CLI APT key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'

- name: Add GitHub CLI APT repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: [deb]
    uris: https://cli.github.com/packages
    suites: [stable]
    components: [main]
    architectures: [amd64]
    # Already scoped to its own keyring, downloaded by the task above, so this
    # is a straight translation of the one-line deb entry.
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    state: present

- name: Remove the superseded GitHub CLI .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/github-cli.list
    state: absent

- name: Install GitHub CLI (gh)
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

# No `gh auth login`: that stored a second plaintext copy of the PAT in
# ~/.config/gh/hosts.yml. gh — and git, through its `gh auth git-credential`
# helper (.gitconfig) — reads GH_TOKEN from the gateway environment instead
# (secrets.env.j2). Interactive `claw` shells have no GH_TOKEN; use
# `sudo openclaw-admin` or export it for the session. See docs/openclaw.md §6.3.
- name: Find a stored gh login holding the PAT in plaintext
  ansible.builtin.find:
    paths: "{{ openclaw_setup_home }}/.config/gh"
    patterns: hosts.yml
    contains: '^\s*oauth_token:'
  register: openclaw_setup_gh_stored_login
  # Same gate as GITHUB_TOKEN/GH_TOKEN in secrets.env.j2: without the PAT there
  # is no environment credential to replace the stored login with.
  when: openclaw_github_pat is defined and openclaw_github_pat | length > 0

- name: Remove the stored gh login
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ openclaw_setup_gh_stored_login.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: Check if uv is installed
  ansible.builtin.stat:
    path: /usr/local/bin/uv
  register: openclaw_setup_uv_stat

- name: Download uv installation script
  ansible.builtin.get_url:
    url: https://astral.sh/uv/install.sh
    dest: /tmp/uv-install.sh
    mode: '0755'
  when: not openclaw_setup_uv_stat.stat.exists

- name: Install uv Python package manager
  ansible.builtin.command:
    cmd: /tmp/uv-install.sh
  environment:
    UV_INSTALL_DIR: /usr/local/bin
  when: not openclaw_setup_uv_stat.stat.exists
  changed_when: true

- name: "Check if signal-cli is installed: {{ openclaw_setup_signal_cli_version }}"
  ansible.builtin.stat:
    path: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}/signal-cli"
  register: openclaw_setup_signal_cli_stat

- name: Download signal-cli native binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/AsamK/signal-cli/releases/download/v{{
      openclaw_setup_signal_cli_version }}/signal-cli-{{
      openclaw_setup_signal_cli_version }}-Linux-native.tar.gz
    dest: "/tmp/signal-cli-{{ openclaw_setup_signal_cli_version }}-Linux-native.tar.gz"
    mode: '0644'
  when: not openclaw_setup_signal_cli_stat.stat.exists

- name: Create signal-cli install directory
  ansible.builtin.file:
    path: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}"
    state: directory
    mode: '0755'
  when: not openclaw_setup_signal_cli_stat.stat.exists

- name: Extract signal-cli
  ansible.builtin.unarchive:
    src: "/tmp/signal-cli-{{ openclaw_setup_signal_cli_version }}-Linux-native.tar.gz"
    dest: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}"
    remote_src: true
  when: not openclaw_setup_signal_cli_stat.stat.exists
  notify: Restart openclaw

- name: Remove downloaded signal-cli archive
  ansible.builtin.file:
    path: "/tmp/signal-cli-{{ openclaw_setup_signal_cli_version }}-Linux-native.tar.gz"
    state: absent
  when: not openclaw_setup_signal_cli_stat.stat.exists

- name: Remove legacy unversioned signal-cli binary
  ansible.builtin.file:
    path: /opt/signal-cli
    state: absent

- name: Symlink signal-cli to /usr/local/bin
  ansible.builtin.file:
    src: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}/signal-cli"
    dest: "{{ openclaw_setup_signal_cli_path }}"
    state: link
  notify: Restart openclaw

- name: "Check if gog CLI is installed: {{ openclaw_setup_gog_cli_version }}"
  ansible.builtin.stat:
    path: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}/gog"
  register: openclaw_setup_gog_cli_stat

- name: Download gog CLI release archive (Linux amd64)
  ansible.builtin.get_url:
    url: >-
      https://github.com/openclaw/gogcli/releases/download/v{{
      openclaw_setup_gog_cli_version }}/gogcli_{{
      openclaw_setup_gog_cli_version }}_linux_amd64.tar.gz
    dest: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ openclaw_setup_gog_cli_sha256 }}"
    mode: '0644'
  when: not openclaw_setup_gog_cli_stat.stat.exists

- name: Create gog CLI install directory
  ansible.builtin.file:
    path: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}"
    state: directory
    mode: '0755'
  when: not openclaw_setup_gog_cli_stat.stat.exists

- name: Extract gog CLI
  ansible.builtin.unarchive:
    src: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    dest: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}"
    remote_src: true
  when: not openclaw_setup_gog_cli_stat.stat.exists

- name: Remove downloaded gog CLI archive
  ansible.builtin.file:
    path: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    state: absent

- name: Symlink gog CLI to /usr/local/bin
  ansible.builtin.file:
    src: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}/gog"
    dest: /usr/local/bin/gog
    state: link
    force: true

# The consumer below already skips once the keyring holds the credentials, via
# its `creates:`. This write had no equivalent guard, so every run wrote a temp
# file that nothing read and the next task deleted — two `changed` results per
# run, for no work. That noise meant a converged host never reported changed=0,
# which is exactly the signal the scheduled drift check exists to produce.
- name: Check whether gog OAuth client credentials are already stored
  ansible.builtin.stat:
    path: "{{ openclaw_setup_gog_credentials_path }}"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  register: openclaw_setup_gog_credentials_stat
  when: openclaw_gog_oauth_client_json is defined

- name: Write gog OAuth client credentials to temp file for claw user
  ansible.builtin.copy:
    content: "{{ openclaw_gog_oauth_client_json }}"
    dest: "{{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
  become: true
  become_user: "{{ openclaw_setup_user }}"
  when:
    - openclaw_gog_oauth_client_json is defined
    - not openclaw_setup_gog_credentials_stat.stat.exists
  no_log: true

- name: Store gog OAuth client credentials for claw user
  ansible.builtin.command:
    cmd: "gog --client default auth credentials set {{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    GOG_KEYRING_PASSWORD: "{{ openclaw_gog_keyring_password }}"
  args:
    creates: "{{ openclaw_setup_gog_credentials_path }}"
  when: openclaw_gog_oauth_client_json is defined
  no_log: true

- name: Remove gog OAuth client credentials temp file
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
    state: absent

- name: Check existing gog auth accounts for claw user
  ansible.builtin.command:
    cmd: gog auth list --plain
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    GOG_KEYRING_PASSWORD: "{{ openclaw_gog_keyring_password }}"
  register: openclaw_setup_gog_auth_list
  changed_when: false
  # `check_mode: false` below makes this probe run for real, including against a
  # host that has never been converged — where a --check run only *simulates*
  # the gog download/extract/symlink, so the binary is absent and this exits
  # 127. Without failed_when the play would hard-fail there, having previously
  # just skipped and carried on. Failing soft leaves stdout empty, which makes
  # the guard below fall through to "would import" — the correct signal.
  failed_when: false
  # Read-only, and it must run during a --check run: `command` is skipped in
  # check mode by default, which left `stdout` empty, made the guard below
  # ("account not in the list") trivially true, and reported a spurious change
  # on every check run. Same treatment as the other read-only probes in this
  # role.
  check_mode: false
  when: openclaw_gog_refresh_token_export_json is defined

- name: Write gog refresh token export to temp file for claw user
  ansible.builtin.copy:
    content: "{{ openclaw_gog_refresh_token_export_json }}"
    dest: "{{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
  become: true
  become_user: "{{ openclaw_setup_user }}"
  when: >-
    openclaw_gog_refresh_token_export_json is defined and
    openclaw_setup_gog_account_email not in openclaw_setup_gog_auth_list.stdout
  no_log: true

- name: Import gog refresh token for claw user
  ansible.builtin.command:
    cmd: "gog auth tokens import {{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    GOG_KEYRING_PASSWORD: "{{ openclaw_gog_keyring_password }}"
  when: >-
    openclaw_gog_refresh_token_export_json is defined and
    openclaw_setup_gog_account_email not in openclaw_setup_gog_auth_list.stdout
  changed_when: true
  no_log: true

- name: Remove gog refresh token temp file
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
    state: absent

- name: Assert the pinned openclaw version understands the templated config schema
  ansible.builtin.assert:
    that:
      - openclaw_setup_version is version('2026.8.1', '>=')
    fail_msg: >-
      openclaw.json.j2 emits the 2026.8.1 schema (agents.entries, memory.search,
      channels.signal.transport); pin openclaw_setup_version >= 2026.8.1 or revert the template.

# Root-owned, so the agent cannot rewrite its own credentials or endpoints, and
# outside $HOME, so it never lands in state backups or memory indexing. Readable
# by the openclaw group because the gateway's systemd *user* manager runs as
# that user and reads EnvironmentFile= itself, as does OpenClaw's updater when
# it rebuilds the service environment. Little new exposure: while the gateway
# runs, any process running as that user can already read the same values from
# its /proc/<pid>/environ. What changes is that they stay readable while the
# gateway is stopped or crash-looping. See docs/openclaw.md §4.1.
- name: Create OpenClaw secrets directory
  ansible.builtin.file:
    path: /etc/openclaw
    state: directory
    owner: root
    group: "{{ openclaw_setup_group }}"
    mode: '0750'

- name: Deploy OpenClaw secrets environment file
  ansible.builtin.template:
    src: secrets.env.j2
    dest: /etc/openclaw/secrets.env
    owner: root
    group: "{{ openclaw_setup_group }}"
    mode: '0640'
  notify: Restart openclaw

# --- OpenClaw installation (claw-owned, self-updatable) --------------------
#
# OpenClaw lives in a claw-owned npm prefix rather than root's /usr, so its own
# updater — which runs as claw, from chat (`update.run`) or `openclaw update` —
# can stage and swap the package tree. Ansible bootstraps it and enforces
# openclaw_setup_version as a *minimum*: it upgrades an older install through
# that same updater, and refuses to converge a host that is ahead of the repo
# instead of silently downgrading it across a state migration.
# See docs/openclaw.md §4.4.

# Makes every npm run as claw (interactive shells, the agent, the updater's own
# package-manager probe) agree on the global root this role installs into.
- name: Point the openclaw user's npm global prefix at its own directory
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (openclaw_setup role). OpenClaw is installed here so
      # its own updater can replace it — see docs/openclaw.md §4.4.
      prefix={{ openclaw_setup_npm_prefix }}
    dest: "{{ openclaw_setup_home }}/.npmrc"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0644'

- name: Create the openclaw user's npm global prefix
  ansible.builtin.file:
    path: "{{ openclaw_setup_npm_prefix }}"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'

- name: Check for an OpenClaw install in the openclaw user's npm prefix
  ansible.builtin.stat:
    path: "{{ openclaw_setup_npm_prefix }}/lib/node_modules/openclaw/package.json"
  register: openclaw_setup_package_stat

- name: Read the installed OpenClaw package manifest
  ansible.builtin.slurp:
    src: "{{ openclaw_setup_npm_prefix }}/lib/node_modules/openclaw/package.json"
  register: openclaw_setup_package_manifest
  when: openclaw_setup_package_stat.stat.exists

# Empty string when absent, which is what every guard below keys off.
- name: Record the installed OpenClaw version
  ansible.builtin.set_fact:
    openclaw_setup_installed_version: >-
      {{ (openclaw_setup_package_manifest.content | b64decode | from_json).version
         if openclaw_setup_package_stat.stat.exists else '' }}

# The one case Ansible must not "fix": OpenClaw upgraded itself on request, and
# the new release may have migrated the SQLite state and openclaw.json schema.
# Re-rendering the old template, or downgrading the package, could then leave
# the gateway crash-looping. Reconciling is a one-line bump, plus a template
# update if the schema changed — see docs/openclaw.md §4.4.
- name: Refuse to converge a host that self-updated past the repo's pin
  ansible.builtin.assert:
    that:
      - >-
        openclaw_setup_installed_version | length == 0 or
        openclaw_setup_installed_version is version(openclaw_setup_version, '<=')
    fail_msg: >-
      OpenClaw {{ openclaw_setup_installed_version }} is installed but the repo pins
      openclaw_setup_version {{ openclaw_setup_version }}. It most likely updated
      itself on request. Bump openclaw_setup_version to {{ openclaw_setup_installed_version }}
      (and update openclaw.json.j2 if the new release changed the config schema)
      before converging — Ansible never downgrades. See docs/openclaw.md §4.4.

- name: Assert a pending upgrade is not blocked by the read-only config flag
  ansible.builtin.assert:
    that:
      - not (openclaw_setup_config_readonly | bool)
    fail_msg: >-
      OpenClaw {{ openclaw_setup_installed_version }} is older than
      openclaw_setup_version {{ openclaw_setup_version }}, but `openclaw update`
      refuses to run while openclaw_setup_config_readonly is true. Turn it off to
      let Ansible upgrade the install.
  when:
    - openclaw_setup_installed_version | length > 0
    - openclaw_setup_installed_version is version(openclaw_setup_version, '<')

# Only for a host with no install yet. Everything after that goes through
# OpenClaw's own updater, which validates the candidate before activating it.
# --allow-scripts (npm >= 11.16) explicitly approves OpenClaw's own lifecycle
# scripts (Node version check, dist inventory), the same approval OpenClaw's
# updater passes. On npm 11 that is a policy, not a sandbox: other packages'
# install scripts still run, with a notice, unless strict-allow-scripts is
# set; npm 12 blocks them. Left non-strict so an optional native dependency
# cannot fail the bootstrap.
- name: Bootstrap OpenClaw into the openclaw user's npm prefix
  ansible.builtin.command:
    argv:
      - npm
      - install
      - --global
      - --prefix
      - "{{ openclaw_setup_npm_prefix }}"
      - --no-fund
      - --no-audit
      - --allow-scripts=openclaw
      - "openclaw@{{ openclaw_setup_version }}"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  when: openclaw_setup_installed_version | length == 0
  changed_when: true
  notify: Restart openclaw

# Without this, a brand-new host would render the auth.profiles pointer into
# openclaw.json but skip the credential-store block below (gated on the fact
# computed before the bootstrap), leaving a pointer to a profile that does not
# exist until the next converge — the silent-fallback state docs/openclaw.md
# §6.4 describes.
- name: Record the bootstrapped OpenClaw version
  ansible.builtin.set_fact:
    openclaw_setup_installed_version: "{{ openclaw_setup_version }}"
  when:
    - openclaw_setup_installed_version | length == 0
    - not ansible_check_mode

# Surfaces the bootstrap and the upgrade as pending changes in --check runs (the
# drift check), where their command tasks are skipped and would stay silent.
- name: Report a pending OpenClaw install or upgrade
  ansible.builtin.debug:
    msg: >-
      {{ ('Would bootstrap OpenClaw ' ~ openclaw_setup_version ~ ' into ' ~ openclaw_setup_npm_prefix)
         if openclaw_setup_installed_version | length == 0 else
         ('Would upgrade OpenClaw ' ~ openclaw_setup_installed_version ~ ' -> '
          ~ openclaw_setup_version ~ ' through `openclaw update`') }}
  changed_when: true
  when:
    - ansible_check_mode
    - >-
      openclaw_setup_installed_version | length == 0 or
      openclaw_setup_installed_version is version(openclaw_setup_version, '<')

# Raising openclaw_setup_version above the installed release upgrades through
# OpenClaw's own updater, the same path the agent's `update.run` takes: staged
# install, canary boot on copied state, then stop/swap/restart with automatic
# rollback while the schema allows it.
#
# Deliberately before openclaw.json.j2 is rendered: the updater's Doctor pass
# migrates the live config to the new release's schema first, and only then
# does the (bumped) template land, followed by the end-of-play restart. The
# other order would briefly run the old binary against a new-schema config.
#
# Skipped in --check runs: `command` does not run there, so nothing would be
# registered for the wait and the assert to read. "Report a pending OpenClaw
# install or upgrade" above is what surfaces the pending upgrade in check mode.
- name: Upgrade OpenClaw to the pinned minimum through its own updater
  when:
    - not ansible_check_mode
    - openclaw_setup_installed_version | length > 0
    - openclaw_setup_installed_version is version(openclaw_setup_version, '<')
  block:
    # The run ledger's latest entry before this update starts, so the wait
    # below can tell this update's run apart from an older one.
    - name: Read the OpenClaw update ledger before starting
      ansible.builtin.command:
        argv: "{{ openclaw_setup_cli_argv + ['update', 'status', '--json'] }}"
      register: openclaw_setup_update_status_before
      changed_when: false

    # Returns as soon as the update is handed off: with a managed gateway
    # service, `openclaw update` delegates to a detached helper even when started
    # from a terminal (verified on claw), so the command's own exit says nothing
    # about the outcome.
    - name: Start the OpenClaw update
      ansible.builtin.command:
        argv: "{{ openclaw_setup_cli_argv + ['update', '--tag', openclaw_setup_version, '--yes', '--json'] }}"
      changed_when: true

    # Without this wait, the play would carry on — rendering openclaw.json and
    # restarting the gateway from the end-of-play handler — while the helper is
    # still stopping and swapping the package underneath it. `update status`
    # reads the run ledger from the state database, so it keeps answering
    # across the gateway restart the update performs. Done means: no run is
    # active *and* the latest run is a new one, so a poll that lands before the
    # new run is recorded cannot be mistaken for the previous run's outcome.
    - name: Wait for the OpenClaw update to finish
      ansible.builtin.command:
        argv: "{{ openclaw_setup_cli_argv + ['update', 'status', '--json'] }}"
      register: openclaw_setup_update_status
      until: >-
        openclaw_setup_update_status.rc == 0 and
        not ((openclaw_setup_update_status.stdout | from_json).activeRun | default(none)) and
        ((openclaw_setup_update_status.stdout | from_json).lastRun | default({}, true)).runId | default('')
        != ((openclaw_setup_update_status_before.stdout | from_json).lastRun | default({}, true)).runId | default('')
      retries: 90
      delay: 20
      changed_when: false

    - name: Assert the OpenClaw update succeeded
      vars:
        openclaw_setup_update_last_run: >-
          {{ (openclaw_setup_update_status.stdout | from_json).lastRun | default({}, true) }}
      ansible.builtin.assert:
        that:
          - openclaw_setup_update_last_run.status | default('') == 'succeeded'
          - >-
            (openclaw_setup_update_last_run.after | default({}, true)).version | default('')
            == openclaw_setup_version
        fail_msg: >-
          The OpenClaw update to {{ openclaw_setup_version }} did not succeed:
          status={{ openclaw_setup_update_last_run.status | default('unknown') }}
          reason={{ openclaw_setup_update_last_run.reason | default('unknown') }}.
          The previous release normally keeps serving after a failed validation;
          check `sudo openclaw-admin update status` and the report under
          ~/.openclaw/logs/support/ before restarting anything. See docs/openclaw.md §4.4.

- name: Install Claude Code CLI globally via npm
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
  when: openclaw_setup_claude_cli_enabled

# --- OpenClaw credential stores: references only ---------------------------
#
# openclaw.json only carries env SecretRefs (openclaw.json.j2), but OpenClaw
# keeps its own credential stores — auth profiles in SQLite, the generated
# models.json — that Ansible does not render. `openclaw secrets audit` is the
# gate: every converge (and every --check drift run) audits them, a finding is
# fixed the way OpenClaw documents, and the audit must then come back clean.
# See docs/openclaw.md §4.1.
#
# Deliberately before openclaw.json.j2 is rendered: `models auth logout` also
# drops the profile from auth.profiles in openclaw.json, and the template run
# below restores that pointer in the same converge.
- name: Keep OpenClaw's credential stores reference-only
  when: openclaw_setup_installed_version | length > 0
  block:
    - name: Deploy the OpenClaw secrets apply plan
      ansible.builtin.copy:
        src: secrets-plan.json
        dest: "{{ openclaw_setup_secrets_plan_path }}"
        owner: root
        group: "{{ openclaw_setup_group }}"
        mode: '0640'

    # Read-only, so it also runs in --check: that is what makes leftover
    # plaintext show up in the drift check. A non-zero exit (2: unresolved
    # refs) means a broken SecretRef — fail rather than "fix" anything.
    - name: Audit OpenClaw's credential stores
      ansible.builtin.command:
        argv: "{{ openclaw_setup_cli_argv + ['secrets', 'audit', '--json'] }}"
      register: openclaw_setup_secrets_audit
      changed_when: false
      check_mode: false
      # Reads OpenClaw's credential stores; only ever consumed by from_json.
      no_log: true

    - name: List OpenClaw auth profiles
      ansible.builtin.command:
        argv: "{{ openclaw_setup_cli_argv + ['models', 'auth', 'list', '--json'] }}"
      register: openclaw_setup_auth_profiles
      changed_when: false
      check_mode: false
      no_log: true

    - name: Work out what the credential stores need
      vars:
        openclaw_setup_audit_findings: "{{ (openclaw_setup_secrets_audit.stdout | from_json).findings | default([]) }}"
        openclaw_setup_profiles_raw: "{{ openclaw_setup_auth_profiles.stdout | from_json }}"
      ansible.builtin.set_fact:
        # Profiles holding a plaintext key or token.
        openclaw_setup_plaintext_profiles: >-
          {{ openclaw_setup_audit_findings
             | selectattr('code', 'equalto', 'PLAINTEXT_FOUND')
             | selectattr('profileId', 'defined')
             | map(attribute='profileId') | unique | list }}
        # `models auth list --json` is {agentId, profiles: [{id, provider, ...}], ...}.
        openclaw_setup_auth_profile_ids: >-
          {{ openclaw_setup_profiles_raw.profiles | default([]) | map(attribute='id') | list }}
        # The generated model catalog, when it still holds a plaintext key.
        openclaw_setup_models_json_residue: >-
          {{ openclaw_setup_audit_findings
             | selectattr('code', 'equalto', 'PLAINTEXT_FOUND')
             | selectattr('file', 'defined')
             | selectattr('file', 'search', '/agent/models[.]json$')
             | map(attribute='file') | unique | list }}

    # Also removes profiles this repo does not manage: nothing in
    # openclaw.json.j2 uses the openai provider. Keep a provider's profile only
    # once its credential is in the vault and referenced from secrets.env.
    - name: Remove auth profiles holding plaintext or not managed here
      ansible.builtin.command:
        argv: "{{ openclaw_setup_cli_argv + ['models', 'auth', 'logout', item, '--yes'] }}"
      loop: >-
        {{ (openclaw_setup_plaintext_profiles
            + (openclaw_setup_auth_profile_ids | select('in', ['openai:default']) | list))
           | unique }}
      changed_when: true
      notify: Restart openclaw

    # The claude-cli runtime needs an anthropic auth profile (docs §6.4); it is
    # recreated as a tokenRef to CLAUDE_CODE_OAUTH_TOKEN, never as a pasted
    # token. Must run after the logout above: logout removes a profile from
    # every store, including an agent-local one this plan creates.
    - name: Recreate the Claude auth profile as a reference to CLAUDE_CODE_OAUTH_TOKEN
      ansible.builtin.command:
        argv: "{{ openclaw_setup_cli_argv + ['secrets', 'apply', '--from', openclaw_setup_secrets_plan_path] }}"
      when:
        - openclaw_setup_claude_cli_enabled
        - >-
          'anthropic:manual' not in openclaw_setup_auth_profile_ids or
          'anthropic:manual' in openclaw_setup_plaintext_profiles
      changed_when: true
      notify: Restart openclaw

    # A generated cache, last written before openclaw.json switched to
    # SecretRefs; the gateway regenerates it with non-secret markers.
    - name: Remove the generated model catalog still holding a plaintext key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ openclaw_setup_models_json_residue }}"
      notify: Restart openclaw

    - name: Report pending credential-store cleanup
      ansible.builtin.debug:
        msg: >-
          Would clean {{ (openclaw_setup_secrets_audit.stdout | from_json).findings | default([])
                         | map(attribute='jsonPath') | join(', ') }}
      changed_when: true
      when:
        - ansible_check_mode
        - (openclaw_setup_secrets_audit.stdout | from_json).status | default('', true) != 'clean'

# Earlier openclaw.json copies from before the SecretRef switch — Doctor and
# updater backups — still hold the gateway token, Telegram bot token and
# Scaleway key as plaintext. Matched on structure (a credential field holding a
# JSON string rather than a SecretRef object), so no value appears here; copies
# written since hold references and are left alone.
- name: Find old openclaw.json copies holding plaintext credentials
  ansible.builtin.find:
    paths: "{{ openclaw_setup_home }}/.openclaw"
    patterns: "openclaw.json.bak*,openclaw.json.clobbered*"
    # Doctor and the updater also leave copies in subdirectories.
    recurse: true
    contains: '"(token|botToken|apiKey)"\s*:\s*"'
    # re.search over the whole (small) file; line-by-line mode uses re.match,
    # which is anchored and never matches an indented JSON key.
    read_whole_file: true
  register: openclaw_setup_plaintext_config_copies

- name: Remove old openclaw.json copies holding plaintext credentials
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ openclaw_setup_plaintext_config_copies.files }}"
  loop_control:
    label: "{{ item.path }}"

# The agent no longer gets the vault password (secrets.env.j2). This stray file
# was not even the current password and decrypts none of the 35 distinct vault
# values in this repository's history (checked 2026-09-19): nothing needs it.
- name: Remove the stray vault key file from the openclaw user's home
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.ansible-personal-key"
    state: absent

- name: Create OpenClaw config directory
  ansible.builtin.file:

    path: "{{ openclaw_setup_home }}/.openclaw"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0700'

- name: Deploy openclaw.json configuration
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_setup_home }}/.openclaw/openclaw.json"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
    validate: python3 -c "import json,sys; json.load(open(sys.argv[1]))" %s
  notify: Restart openclaw

# Runs after openclaw.json is rendered, not inside the block above: `models auth
# logout` drops the profile pointer from openclaw.json and the template restores
# it, so gating earlier could abort the play with the pointer still missing —
# the silent-fallback state docs/openclaw.md §6.4 describes. It also means the
# audit judges the converged file.
- name: Re-audit OpenClaw's credential stores
  ansible.builtin.command:
    argv: "{{ openclaw_setup_cli_argv + ['secrets', 'audit', '--check', '--json'] }}"
  register: openclaw_setup_secrets_reaudit
  changed_when: false
  failed_when: false
  # Reads OpenClaw's credential stores; the assert below reports what matters.
  no_log: true
  when:
    - openclaw_setup_installed_version | length > 0
    - not ansible_check_mode

- name: Assert OpenClaw's credential stores are clean
  vars:
    # The probe runs with failed_when: false, so a run that never produced JSON
    # (no systemd-run, missing EnvironmentFile, transient unit refused to start)
    # also lands here; rendering must not fail on it and hide the cause.
    openclaw_setup_reaudit_stdout: "{{ openclaw_setup_secrets_reaudit.stdout | default('', true) }}"
    openclaw_setup_reaudit_findings: >-
      {{ (openclaw_setup_reaudit_stdout | from_json).findings | default([], true)
         if openclaw_setup_reaudit_stdout | length > 0 else [] }}
  ansible.builtin.assert:
    that:
      - openclaw_setup_secrets_reaudit.rc | default(1) == 0
    fail_msg: >-
      `openclaw secrets audit --check` did not come back clean.
      Findings: {{ openclaw_setup_reaudit_findings | map(attribute='jsonPath') | join(', ') | default('none reported', true) }}.
      {{ openclaw_setup_secrets_reaudit.stderr | default('', true) }}
      Inspect with `sudo openclaw-admin secrets audit` on the host. See docs/openclaw.md §4.1.
  when:
    - openclaw_setup_installed_version | length > 0
    - not ansible_check_mode

- name: Deploy openclaw-admin wrapper for manual admin commands needing secrets.env
  ansible.builtin.template:
    src: openclaw-admin.j2
    dest: /usr/local/bin/openclaw-admin
    owner: root
    group: root
    mode: '0755'
    validate: bash -n %s

# Root-owned inside a claw-owned directory on purpose: OpenClaw reads the unit
# from this exact path, and treats one it does not own as a sealed definition —
# still restarted and verified during updates, never rewritten by OpenClaw.
# Advisory only against the openclaw user itself, who controls its own user
# manager (see the template header); Ansible re-asserts it on every converge.
- name: Deploy the OpenClaw gateway systemd user unit
  ansible.builtin.template:
    src: openclaw-gateway.service.j2
    dest: "{{ openclaw_setup_home }}/.config/systemd/user/{{ openclaw_setup_systemd_unit }}"
    owner: root
    group: root
    mode: '0644'
  register: openclaw_setup_user_unit_result
  notify: Restart openclaw

# A --check run against a host that still runs the legacy system unit does not
# write the unit above, and systemctl then fails with "Could not find the
# requested service" instead of reporting a pending change. The user-scope tasks
# and handlers key off this to stay check-mode safe for the drift check.
- name: Check whether the OpenClaw gateway user unit is in place
  ansible.builtin.stat:
    path: "{{ openclaw_setup_home }}/.config/systemd/user/{{ openclaw_setup_systemd_unit }}"
  register: openclaw_setup_user_unit_stat

# --- One-shot migration: system unit -> user unit ---------------------------
#
# The gateway used to run as /etc/systemd/system/openclaw.service. It must be
# gone before the user unit starts: both bind the same port, and OpenClaw
# refuses to activate its user unit while a system unit named `openclaw.service`
# exists, so leaving it would also break every later self-update.
- name: Check for the legacy OpenClaw system unit
  ansible.builtin.stat:
    path: /etc/systemd/system/openclaw.service
  register: openclaw_setup_legacy_unit_stat

- name: Stop and disable the legacy OpenClaw system unit
  ansible.builtin.systemd_service:
    name: openclaw.service
    state: stopped
    enabled: false
  when: openclaw_setup_legacy_unit_stat.stat.exists

- name: Remove the legacy OpenClaw system unit
  ansible.builtin.file:
    path: /etc/systemd/system/openclaw.service
    state: absent

# Explicit tasks rather than handlers: both managers must know the new layout
# before the user unit starts further down, while handlers — the gateway
# restart in particular — must keep running at the end of the play, after any
# upgrade, not in the middle of it.
- name: Make the system manager forget the legacy unit
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: openclaw_setup_legacy_unit_stat.stat.exists

- name: Make the openclaw user manager load the gateway unit
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ openclaw_setup_uid }}"
  when:
    - openclaw_setup_user_unit_result is changed
    - openclaw_setup_user_unit_stat.stat.exists
# --- End of one-shot migration ----------------------------------------------

- name: Restrict ptrace scope to admin-only (YAMA security hardening)
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "2"
    sysctl_set: true
    state: present
    reload: true

- name: Check if SSL certificate exists
  ansible.builtin.stat:

    path: "/etc/letsencrypt/live/{{ openclaw_setup_domain }}/fullchain.pem"
  register: openclaw_setup_cert_stat

- name: Generate SSL certificate with Certbot
  ansible.builtin.command:
    cmd: "certbot --nginx -d {{ openclaw_setup_domain }} --non-interactive --agree-tos -m {{ openclaw_setup_email }}"
  when: not openclaw_setup_cert_stat.stat.exists
  changed_when: true

- name: Deploy Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ openclaw_setup_domain }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Enable Nginx configuration
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ openclaw_setup_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ openclaw_setup_domain }}"
    state: link
  notify: Reload nginx

- name: Ensure the OpenClaw gateway user unit is started and enabled
  ansible.builtin.systemd_service:
    name: "{{ openclaw_setup_systemd_unit }}"
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ openclaw_setup_uid }}"
  when: openclaw_setup_user_unit_stat.stat.exists

# Last, once the gateway runs from the claw-owned prefix: the root-owned copy
# would otherwise shadow it as /usr/bin/openclaw for every other account, and
# OpenClaw's updater warns when the shell's `openclaw` and the service disagree.
# One-shot: the stat keeps npm from running as root on every later converge.
- name: Check for the legacy root-owned global OpenClaw install
  ansible.builtin.stat:
    path: /usr/lib/node_modules/openclaw
  register: openclaw_setup_legacy_package_stat

- name: Remove the legacy root-owned global OpenClaw install
  community.general.npm:
    name: openclaw
    global: true
    state: absent
  when: openclaw_setup_legacy_package_stat.stat.exists

- name: Ensure Nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Clone Addy Osmani's agent-skills repository
  ansible.builtin.git:
    repo: 'https://github.com/addyosmani/agent-skills.git'
    dest: "{{ openclaw_setup_home }}/src/agent-skills"
    version: main
    update: true
  become: true
  become_user: "{{ openclaw_setup_user }}"

- name: Ensure OpenClaw workspace skills directory exists
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.openclaw/workspace/skills"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'

- name: Find all skills in the cloned repository
  ansible.builtin.find:
    paths: "{{ openclaw_setup_home }}/src/agent-skills/skills"
    file_type: directory
  register: openclaw_setup_agent_skills_dirs

# These links are entirely remote-to-remote — nothing is transferred — so the
# old `file: state=link` loop was pure round-trip overhead: ~20 skills at ~0.7s
# each, 14.65s from a GitHub runner to create links that already existed.
#
# Ansible has no bulk-symlink module, so this is split into a read-only
# detection pass and a fix pass: two round trips instead of twenty. Replacing
# the whole directory with a single symlink to the checkout would be simpler
# still, but any skill OpenClaw created at runtime would then land inside the
# git clone, so the per-skill layout is kept exactly as before.
- name: Detect skills symlinks that are missing or point elsewhere
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dest_dir={{ (openclaw_setup_home ~ '/.openclaw/workspace/skills') | quote }}
      for src in {{ openclaw_setup_agent_skills_dirs.files
                    | map(attribute='path') | map('quote') | join(' ') }}; do
        target="${dest_dir}/$(basename -- "${src}")"
        if [ "$(readlink -- "${target}" 2>/dev/null || true)" != "${src}" ]; then
          printf '%s\n' "${src}"
        fi
      done
    # Ansible's `shell` runs /bin/sh, which on Debian is dash and has no
    # `pipefail`. Without this the task dies with "Illegal option -o pipefail".
    executable: /bin/bash
  register: openclaw_setup_skills_link_drift
  # Read-only, so it is safe — and necessary — to run during a --check run:
  # without it the fix task below has nothing to report and drift would be
  # invisible. The `changed_when` is what surfaces that drift in check mode.
  check_mode: false
  changed_when: openclaw_setup_skills_link_drift.stdout | length > 0
  when: openclaw_setup_agent_skills_dirs.matched > 0

- name: Symlink skills to OpenClaw workspace skills directory
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dest_dir={{ (openclaw_setup_home ~ '/.openclaw/workspace/skills') | quote }}
      printf '%s\n' {{ openclaw_setup_skills_link_drift.stdout_lines
                       | map('quote') | join(' ') }} | while read -r src; do
        ln -sfn -- "${src}" "${dest_dir}/$(basename -- "${src}")"
      done
    executable: /bin/bash
  # Explicit `become` alongside `become_user` so the links are owned by the
  # openclaw user, matching what the old `file` task set via owner/group.
  become: true
  become_user: "{{ openclaw_setup_user }}"
  changed_when: true
  when:
    - openclaw_setup_agent_skills_dirs.matched > 0
    - openclaw_setup_skills_link_drift.stdout_lines | default([]) | length > 0
