---
- name: Create openclaw group
  ansible.builtin.group:
    name: "{{ openclaw_setup_group }}"
    state: present

- name: Create openclaw user
  ansible.builtin.user:
    name: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    home: "{{ openclaw_setup_home }}"
    shell: /usr/bin/zsh
    state: present

- name: Deploy SSH authorized key for openclaw user
  ansible.posix.authorized_key:
    user: "{{ openclaw_setup_user }}"
    state: present
    key: "{{ openclaw_setup_ssh_key }}"
  when: openclaw_setup_ssh_key | length > 0

- name: Remove any sudoers configuration for openclaw user
  ansible.builtin.file:

    path: "/etc/sudoers.d/{{ openclaw_setup_user }}"
    state: absent

# Deliberate, scoped grant (a documented exception to the privileged-groups
# deny-list asserted below): lets the openclaw user run `journalctl -u <service>`
# to debug services like fastmail-mcp without sudo. NOTE: systemd-journal grants
# read access to the FULL system journal (all units, including sshd/PAM auth
# events, sudo invocations and kernel messages) — on this journald host that is
# largely the same content `adm` would expose. Accepted trade-off to avoid
# granting sudo or `adm`. Placed before the group snapshot so the deny-list
# assertion validates the state the role actually converges to.
- name: Add openclaw user to systemd-journal group for read-only journal access
  ansible.builtin.user:
    name: "{{ openclaw_setup_user }}"
    groups: systemd-journal
    append: true
  notify: Restart openclaw

- name: Get active groups for openclaw user
  ansible.builtin.command:
    cmd: "id -Gn {{ openclaw_setup_user }}"
  register: openclaw_setup_user_groups_cmd
  changed_when: false
  check_mode: false

- name: Assert openclaw user is not a member of privileged groups
  ansible.builtin.assert:
    that:
      - "'sudo' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'root' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'wheel' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'shadow' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'adm' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'disk' not in openclaw_setup_user_groups_cmd.stdout.split()"
    fail_msg: "SECURITY VIOLATION: User {{ openclaw_setup_user }} belongs to a privileged group! Groups: {{ openclaw_setup_user_groups_cmd.stdout }}"
    success_msg: "Security assertion passed: User {{ openclaw_setup_user }} is not a member of any privileged groups."

- name: Check sudo privilege status for openclaw user
  ansible.builtin.command:
    cmd: "sudo -n -l -U {{ openclaw_setup_user }}"
  register: openclaw_setup_sudo_check
  changed_when: false
  failed_when: false
  check_mode: false


- name: Assert openclaw user has no sudo privileges
  ansible.builtin.assert:
    that:
      - >-
        openclaw_setup_sudo_check.rc != 0 or
        'not allowed to run sudo' in openclaw_setup_sudo_check.stderr or
        'not allowed to run sudo' in openclaw_setup_sudo_check.stdout
    fail_msg: "SECURITY VIOLATION: User {{ openclaw_setup_user }} has sudo privileges on this system!"
    success_msg: "Security assertion passed: User {{ openclaw_setup_user }} has no sudo privileges."

- name: Test existence of Oh My Zsh for openclaw user

  ansible.builtin.stat:
    path: "{{ openclaw_setup_home }}/.oh-my-zsh"
  register: openclaw_setup_omz_stat

- name: Download OMZ installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/omz-install.sh
    mode: '0755'
  when: not openclaw_setup_omz_stat.stat.exists

- name: Run OMZ installation script for openclaw user
  ansible.builtin.command: /tmp/omz-install.sh --unattended --keep-zshrc
  when: not openclaw_setup_omz_stat.stat.exists
  changed_when: true
  become: true
  become_user: "{{ openclaw_setup_user }}"

- name: Install dotfiles for openclaw user
  ansible.builtin.template:
    src: "{{ role_path }}/../master_setup/templates/dotfiles/{{ item }}"
    dest: "{{ openclaw_setup_home }}/{{ item }}"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0644'
  loop:
    - .bashrc
    - .gitignore_global
    - .profile
    - .zshrc
    - .gitconfig

- name: Create compilation cache directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_compile_cache }}"
    state: directory

    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'

- name: Enable lingering for openclaw user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ openclaw_setup_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ openclaw_setup_user }}"

- name: Create systemd user configuration directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.config/systemd/user"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'

- name: Install dependencies
  ansible.builtin.apt:
    name:
      - nginx
      - certbot
      - python3-certbot-nginx
      - curl
      - gnupg
      - ca-certificates
      - acl
      # Required on the managed node by ansible.builtin.deb822_repository,
      # which replaces the deprecated apt_key/apt_repository below. Note that on
      # a host that does not have it yet, a first `--check` run fails at the
      # repository tasks: check mode only simulates this install, so the module
      # still finds the library missing. That is expected, not a regression —
      # apply once, then --check works.
      - python3-debian
    state: present
    update_cache: true

- name: Allow HTTP and HTTPS in ufw firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"

# --- One-shot migration cleanups -------------------------------------------
#
# These run *before* deb822_repository, not after. The module derives its
# keyring filename from `name` plus the fetched key's encoding — armored gives
# nodesource.asc, binary gives nodesource.gpg — so the orphan removal below
# targets a name the module itself can legitimately produce. Ordered after the
# module, the play would delete the keyring it had just installed the moment
# NodeSource served that key dearmored, and `Install Node.js` (update_cache)
# would fail with NO_PUBKEY, flapping on every run. A --check run cannot catch
# that, since nothing is written.

# apt_repository appends rather than replaces, so bumping the Node major left
# the previous release's line behind: on claw this file held both node_24.x and
# node_26.x, meaning apt could resolve nodejs from either. deb822_repository
# writes nodesource.sources instead, and apt would read both.
- name: Remove the superseded NodeSource .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/nodesource.list
    state: absent

- name: Remove the orphaned NodeSource keyring left by the old flow
  ansible.builtin.file:
    path: /etc/apt/keyrings/nodesource.gpg
    state: absent

# apt_key put the NodeSource key in /etc/apt/trusted.gpg, where it is trusted to
# sign *any* repository. That file is host-wide rather than role-scoped, so
# deleting it unconditionally would untrust whatever else has landed there —
# another host in this group, or an `apt-key add` between converges — and the
# damage would surface later as an apt signature error on an unrelated
# repository. The evidence is therefore re-checked on every run instead of being
# recorded in a comment.
#
# Matching on `pub:` records, not `fpr:`: gpg emits an fpr line per subkey too,
# so filtering fingerprints would leave the NodeSource *subkey*
# (0FA5ECC8C0CA58863C0AC5867E9656125E955B26) behind and the condition could
# never hold.
# The probe below must not run against a path that does not exist: `gpg
# --keyring <path>` *creates* an empty keyring (32 bytes) as a side effect. That
# turned the removal into a permanent churn loop — the probe recreated
# /etc/apt/trusted.gpg on every run and the next task deleted it again, so a
# converged host reported `changed` forever. Verified on claw: pointing gpg at a
# nonexistent path leaves a 32-byte file behind, exactly the size found there.
- name: Check whether the legacy globally-trusted apt keyring exists
  ansible.builtin.stat:
    path: /etc/apt/trusted.gpg
  register: openclaw_setup_legacy_trusted_stat

- name: Inspect the legacy globally-trusted apt keyring
  ansible.builtin.command:
    cmd: gpg --no-default-keyring --keyring /etc/apt/trusted.gpg --list-keys --with-colons
  when: openclaw_setup_legacy_trusted_stat.stat.exists
  register: openclaw_setup_legacy_trusted
  changed_when: false
  # Absent keyring, or no gpg, exits non-zero; that is a reason to leave the
  # file alone, not to fail the play.
  failed_when: false
  # Read-only, and it has to run during --check or the guard below would compare
  # against an empty stdout and delete on the strength of no evidence at all.
  check_mode: false

- name: Remove the legacy globally-trusted apt keyring
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg
    state: absent
  when:
    - openclaw_setup_legacy_trusted_stat.stat.exists
    - openclaw_setup_legacy_trusted.rc | default(1) == 0
    - openclaw_setup_legacy_trusted.stdout_lines | default([])
      | select('match', '^pub:')
      | reject('search', '2F59B5F99B1BE0B4')
      | list | length == 0

# --- End of one-shot migration cleanups ------------------------------------

# apt_key and apt_repository are both deprecated and removed in ansible-core
# 2.25. deb822_repository replaces the pair: it carries the signing key with the
# repository definition, so the key is scoped to this one source instead of
# being trusted for every repository on the host — which is the actual reason
# apt_key is going away.
#
# The module creates /etc/apt/keyrings itself when it needs to store a key
# (ensure_keyrings_dir), so it does not depend on the task further down that
# also creates it.
- name: Add NodeSource repository
  ansible.builtin.deb822_repository:
    name: nodesource
    types: [deb]
    uris: https://deb.nodesource.com/node_26.x
    suites: [nodistro]
    components: [main]
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add GitHub CLI APT key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'

- name: Add GitHub CLI APT repository
  ansible.builtin.deb822_repository:
    name: github-cli
    types: [deb]
    uris: https://cli.github.com/packages
    suites: [stable]
    components: [main]
    architectures: [amd64]
    # Already scoped to its own keyring, downloaded by the task above, so this
    # is a straight translation of the one-line deb entry.
    signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    state: present

- name: Remove the superseded GitHub CLI .list definition
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/github-cli.list
    state: absent

- name: Install GitHub CLI (gh)
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

- name: Authenticate GitHub CLI (gh) for claw user
  ansible.builtin.shell:
    cmd: "set -o pipefail; echo '{{ openclaw_github_pat }}' | gh auth login --with-token"
    executable: /bin/bash
  become: true
  become_user: "{{ openclaw_setup_user }}"
  args:
    creates: "{{ openclaw_setup_home }}/.config/gh/hosts.yml"
  when: openclaw_github_pat is defined

- name: Check if uv is installed
  ansible.builtin.stat:
    path: /usr/local/bin/uv
  register: openclaw_setup_uv_stat

- name: Download uv installation script
  ansible.builtin.get_url:
    url: https://astral.sh/uv/install.sh
    dest: /tmp/uv-install.sh
    mode: '0755'
  when: not openclaw_setup_uv_stat.stat.exists

- name: Install uv Python package manager
  ansible.builtin.command:
    cmd: /tmp/uv-install.sh
  environment:
    UV_INSTALL_DIR: /usr/local/bin
  when: not openclaw_setup_uv_stat.stat.exists
  changed_when: true

- name: "Check if signal-cli is installed: {{ openclaw_setup_signal_cli_version }}"
  ansible.builtin.stat:
    path: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}/signal-cli"
  register: openclaw_setup_signal_cli_stat

- name: Download signal-cli native binary
  ansible.builtin.get_url:
    url: >-
      https://github.com/AsamK/signal-cli/releases/download/v{{
      openclaw_setup_signal_cli_version }}/signal-cli-{{
      openclaw_setup_signal_cli_version }}-Linux-native.tar.gz
    dest: "/tmp/signal-cli-{{ openclaw_setup_signal_cli_version }}-Linux-native.tar.gz"
    mode: '0644'
  when: not openclaw_setup_signal_cli_stat.stat.exists

- name: Create signal-cli install directory
  ansible.builtin.file:
    path: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}"
    state: directory
    mode: '0755'
  when: not openclaw_setup_signal_cli_stat.stat.exists

- name: Extract signal-cli
  ansible.builtin.unarchive:
    src: "/tmp/signal-cli-{{ openclaw_setup_signal_cli_version }}-Linux-native.tar.gz"
    dest: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}"
    remote_src: true
  when: not openclaw_setup_signal_cli_stat.stat.exists
  notify: Restart openclaw

- name: Remove downloaded signal-cli archive
  ansible.builtin.file:
    path: "/tmp/signal-cli-{{ openclaw_setup_signal_cli_version }}-Linux-native.tar.gz"
    state: absent
  when: not openclaw_setup_signal_cli_stat.stat.exists

- name: Remove legacy unversioned signal-cli binary
  ansible.builtin.file:
    path: /opt/signal-cli
    state: absent

- name: Symlink signal-cli to /usr/local/bin
  ansible.builtin.file:
    src: "/opt/signal-cli-{{ openclaw_setup_signal_cli_version }}/signal-cli"
    dest: "{{ openclaw_setup_signal_cli_path }}"
    state: link
  notify: Restart openclaw

- name: "Check if gog CLI is installed: {{ openclaw_setup_gog_cli_version }}"
  ansible.builtin.stat:
    path: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}/gog"
  register: openclaw_setup_gog_cli_stat

- name: Download gog CLI release archive (Linux amd64)
  ansible.builtin.get_url:
    url: >-
      https://github.com/openclaw/gogcli/releases/download/v{{
      openclaw_setup_gog_cli_version }}/gogcli_{{
      openclaw_setup_gog_cli_version }}_linux_amd64.tar.gz
    dest: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    checksum: "sha256:{{ openclaw_setup_gog_cli_sha256 }}"
    mode: '0644'
  when: not openclaw_setup_gog_cli_stat.stat.exists

- name: Create gog CLI install directory
  ansible.builtin.file:
    path: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}"
    state: directory
    mode: '0755'
  when: not openclaw_setup_gog_cli_stat.stat.exists

- name: Extract gog CLI
  ansible.builtin.unarchive:
    src: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    dest: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}"
    remote_src: true
  when: not openclaw_setup_gog_cli_stat.stat.exists

- name: Remove downloaded gog CLI archive
  ansible.builtin.file:
    path: "/tmp/gogcli-{{ openclaw_setup_gog_cli_version }}-linux-amd64.tar.gz"
    state: absent

- name: Symlink gog CLI to /usr/local/bin
  ansible.builtin.file:
    src: "/opt/gogcli-{{ openclaw_setup_gog_cli_version }}/gog"
    dest: /usr/local/bin/gog
    state: link
    force: true

# The consumer below already skips once the keyring holds the credentials, via
# its `creates:`. This write had no equivalent guard, so every run wrote a temp
# file that nothing read and the next task deleted — two `changed` results per
# run, for no work. That noise meant a converged host never reported changed=0,
# which is exactly the signal the scheduled drift check exists to produce.
- name: Check whether gog OAuth client credentials are already stored
  ansible.builtin.stat:
    path: "{{ openclaw_setup_gog_credentials_path }}"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  register: openclaw_setup_gog_credentials_stat
  when: openclaw_gog_oauth_client_json is defined

- name: Write gog OAuth client credentials to temp file for claw user
  ansible.builtin.copy:
    content: "{{ openclaw_gog_oauth_client_json }}"
    dest: "{{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
  become: true
  become_user: "{{ openclaw_setup_user }}"
  when:
    - openclaw_gog_oauth_client_json is defined
    - not openclaw_setup_gog_credentials_stat.stat.exists
  no_log: true

- name: Store gog OAuth client credentials for claw user
  ansible.builtin.command:
    cmd: "gog --client default auth credentials set {{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    GOG_KEYRING_PASSWORD: "{{ openclaw_gog_keyring_password }}"
  args:
    creates: "{{ openclaw_setup_gog_credentials_path }}"
  when: openclaw_gog_oauth_client_json is defined
  no_log: true

- name: Remove gog OAuth client credentials temp file
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
    state: absent

- name: Check existing gog auth accounts for claw user
  ansible.builtin.command:
    cmd: gog auth list --plain
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    GOG_KEYRING_PASSWORD: "{{ openclaw_gog_keyring_password }}"
  register: openclaw_setup_gog_auth_list
  changed_when: false
  # `check_mode: false` below makes this probe run for real, including against a
  # host that has never been converged — where a --check run only *simulates*
  # the gog download/extract/symlink, so the binary is absent and this exits
  # 127. Without failed_when the play would hard-fail there, having previously
  # just skipped and carried on. Failing soft leaves stdout empty, which makes
  # the guard below fall through to "would import" — the correct signal.
  failed_when: false
  # Read-only, and it must run during a --check run: `command` is skipped in
  # check mode by default, which left `stdout` empty, made the guard below
  # ("account not in the list") trivially true, and reported a spurious change
  # on every check run. Same treatment as the other read-only probes in this
  # role.
  check_mode: false
  when: openclaw_gog_refresh_token_export_json is defined

- name: Write gog refresh token export to temp file for claw user
  ansible.builtin.copy:
    content: "{{ openclaw_gog_refresh_token_export_json }}"
    dest: "{{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
  become: true
  become_user: "{{ openclaw_setup_user }}"
  when: >-
    openclaw_gog_refresh_token_export_json is defined and
    openclaw_setup_gog_account_email not in openclaw_setup_gog_auth_list.stdout
  no_log: true

- name: Import gog refresh token for claw user
  ansible.builtin.command:
    cmd: "gog auth tokens import {{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  environment:
    GOG_KEYRING_PASSWORD: "{{ openclaw_gog_keyring_password }}"
  when: >-
    openclaw_gog_refresh_token_export_json is defined and
    openclaw_setup_gog_account_email not in openclaw_setup_gog_auth_list.stdout
  changed_when: true
  no_log: true

- name: Remove gog refresh token temp file
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
    state: absent

- name: Assert the pinned openclaw version understands the templated config schema
  ansible.builtin.assert:
    that:
      - openclaw_setup_version is version('2026.8.1', '>=')
    fail_msg: >-
      openclaw.json.j2 emits the 2026.8.1 schema (agents.entries, memory.search,
      channels.signal.transport); pin openclaw_setup_version >= 2026.8.1 or revert the template.

- name: Install OpenClaw globally via npm
  community.general.npm:
    name: openclaw
    version: "{{ openclaw_setup_version }}"
    global: true
  notify: Restart openclaw

- name: Install Claude Code CLI globally via npm
  community.general.npm:
    name: "@anthropic-ai/claude-code"
    global: true
  when: openclaw_setup_claude_cli_enabled


- name: Create OpenClaw compile cache directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_compile_cache }}"
    state: directory

    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'

- name: Create OpenClaw config directory
  ansible.builtin.file:

    path: "{{ openclaw_setup_home }}/.openclaw"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0700'

- name: Deploy openclaw.json configuration
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_setup_home }}/.openclaw/openclaw.json"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
    validate: python3 -c "import json,sys; json.load(open(sys.argv[1]))" %s
  notify: Restart openclaw

- name: Create OpenClaw secrets directory
  ansible.builtin.file:
    path: /etc/openclaw
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy OpenClaw secrets environment file
  ansible.builtin.template:
    src: secrets.env.j2
    dest: /etc/openclaw/secrets.env
    owner: root
    group: root
    mode: '0600'
  notify: Restart openclaw


- name: Deploy OpenClaw systemd service
  ansible.builtin.template:
    src: openclaw.service.j2
    dest: /etc/systemd/system/openclaw.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Restrict ptrace scope to admin-only (YAMA security hardening)
  ansible.posix.sysctl:
    name: kernel.yama.ptrace_scope
    value: "2"
    sysctl_set: true
    state: present
    reload: true

- name: Check if SSL certificate exists
  ansible.builtin.stat:

    path: "/etc/letsencrypt/live/{{ openclaw_setup_domain }}/fullchain.pem"
  register: openclaw_setup_cert_stat

- name: Generate SSL certificate with Certbot
  ansible.builtin.command:
    cmd: "certbot --nginx -d {{ openclaw_setup_domain }} --non-interactive --agree-tos -m {{ openclaw_setup_email }}"
  when: not openclaw_setup_cert_stat.stat.exists
  changed_when: true

- name: Deploy Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "/etc/nginx/sites-available/{{ openclaw_setup_domain }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Enable Nginx configuration
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ openclaw_setup_domain }}"
    dest: "/etc/nginx/sites-enabled/{{ openclaw_setup_domain }}"
    state: link
  notify: Reload nginx

- name: Ensure OpenClaw is started and enabled
  ansible.builtin.service:
    name: openclaw
    state: started
    enabled: true

- name: Ensure Nginx is started and enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Clone Addy Osmani's agent-skills repository
  ansible.builtin.git:
    repo: 'https://github.com/addyosmani/agent-skills.git'
    dest: "{{ openclaw_setup_home }}/src/agent-skills"
    version: main
    update: true
  become: true
  become_user: "{{ openclaw_setup_user }}"

- name: Ensure OpenClaw workspace skills directory exists
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.openclaw/workspace/skills"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'

- name: Find all skills in the cloned repository
  ansible.builtin.find:
    paths: "{{ openclaw_setup_home }}/src/agent-skills/skills"
    file_type: directory
  register: openclaw_setup_agent_skills_dirs

# These links are entirely remote-to-remote — nothing is transferred — so the
# old `file: state=link` loop was pure round-trip overhead: ~20 skills at ~0.7s
# each, 14.65s from a GitHub runner to create links that already existed.
#
# Ansible has no bulk-symlink module, so this is split into a read-only
# detection pass and a fix pass: two round trips instead of twenty. Replacing
# the whole directory with a single symlink to the checkout would be simpler
# still, but any skill OpenClaw created at runtime would then land inside the
# git clone, so the per-skill layout is kept exactly as before.
- name: Detect skills symlinks that are missing or point elsewhere
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dest_dir={{ (openclaw_setup_home ~ '/.openclaw/workspace/skills') | quote }}
      for src in {{ openclaw_setup_agent_skills_dirs.files
                    | map(attribute='path') | map('quote') | join(' ') }}; do
        target="${dest_dir}/$(basename -- "${src}")"
        if [ "$(readlink -- "${target}" 2>/dev/null || true)" != "${src}" ]; then
          printf '%s\n' "${src}"
        fi
      done
    # Ansible's `shell` runs /bin/sh, which on Debian is dash and has no
    # `pipefail`. Without this the task dies with "Illegal option -o pipefail".
    executable: /bin/bash
  register: openclaw_setup_skills_link_drift
  # Read-only, so it is safe — and necessary — to run during a --check run:
  # without it the fix task below has nothing to report and drift would be
  # invisible. The `changed_when` is what surfaces that drift in check mode.
  check_mode: false
  changed_when: openclaw_setup_skills_link_drift.stdout | length > 0
  when: openclaw_setup_agent_skills_dirs.matched > 0

- name: Symlink skills to OpenClaw workspace skills directory
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      dest_dir={{ (openclaw_setup_home ~ '/.openclaw/workspace/skills') | quote }}
      printf '%s\n' {{ openclaw_setup_skills_link_drift.stdout_lines
                       | map('quote') | join(' ') }} | while read -r src; do
        ln -sfn -- "${src}" "${dest_dir}/$(basename -- "${src}")"
      done
    executable: /bin/bash
  # Explicit `become` alongside `become_user` so the links are owned by the
  # openclaw user, matching what the old `file` task set via owner/group.
  become: true
  become_user: "{{ openclaw_setup_user }}"
  changed_when: true
  when:
    - openclaw_setup_agent_skills_dirs.matched > 0
    - openclaw_setup_skills_link_drift.stdout_lines | default([]) | length > 0
