---
# /etc/openclaw/secrets.env: the only file this role renders with credentials in
# plaintext. Deployed before anything runs the OpenClaw CLI, because every such
# task starts a transient unit with a non-optional EnvironmentFile= on it.
# See docs/openclaw.md §4.1.

# Root-owned, so the agent cannot rewrite its own credentials or endpoints, and
# outside $HOME, so it never lands in state backups or memory indexing. Readable
# by the openclaw group because the gateway's systemd *user* manager runs as
# that user and reads EnvironmentFile= itself, as does OpenClaw's updater when
# it rebuilds the service environment. Little new exposure: while the gateway
# runs, any process running as that user can already read the same values from
# its /proc/<pid>/environ. What changes is that they stay readable while the
# gateway is stopped or crash-looping. See docs/openclaw.md §4.1.
- name: Create OpenClaw secrets directory
  ansible.builtin.file:
    path: /etc/openclaw
    state: directory
    owner: root
    group: "{{ openclaw_setup_group }}"
    mode: '0750'

- name: Deploy OpenClaw secrets environment file
  ansible.builtin.template:
    src: secrets.env.j2
    dest: /etc/openclaw/secrets.env
    owner: root
    group: "{{ openclaw_setup_group }}"
    mode: '0640'
  notify: Restart openclaw
