---
# The openclaw service account: identity, privilege assertions, shell, dotfiles,
# its cache/tmp directories and the lingering systemd user manager.

- name: Create openclaw group
  ansible.builtin.group:
    name: "{{ openclaw_setup_group }}"
    state: present

- name: Create openclaw user
  ansible.builtin.user:
    name: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    home: "{{ openclaw_setup_home }}"
    shell: /usr/bin/zsh
    state: present
  register: openclaw_setup_user_result

# The gateway runs under this user's systemd manager, reached through
# /run/user/<uid>; every user-scope task and handler needs the numeric uid.
# Empty in a --check run against a host where the user does not exist yet (the
# user module then reports no uid); every consumer is skipped there anyway,
# since the user unit cannot be in place either.
- name: Record the openclaw user's uid for its systemd user manager
  ansible.builtin.set_fact:
    openclaw_setup_uid: "{{ openclaw_setup_user_result.uid | default('') }}"

- name: Deploy SSH authorized key for openclaw user
  ansible.posix.authorized_key:
    user: "{{ openclaw_setup_user }}"
    state: present
    key: "{{ openclaw_setup_ssh_key }}"
  when: openclaw_setup_ssh_key | length > 0

- name: Remove any sudoers configuration for openclaw user
  ansible.builtin.file:

    path: "/etc/sudoers.d/{{ openclaw_setup_user }}"
    state: absent

# Deliberate, scoped grant (a documented exception to the privileged-groups
# deny-list asserted below): lets the openclaw user run `journalctl -u <service>`
# to debug services like fastmail-mcp without sudo. NOTE: systemd-journal grants
# read access to the FULL system journal (all units, including sshd/PAM auth
# events, sudo invocations and kernel messages) — on this journald host that is
# largely the same content `adm` would expose. Accepted trade-off to avoid
# granting sudo or `adm`. Placed before the group snapshot so the deny-list
# assertion validates the state the role actually converges to.
#
# Notifies the user-manager restart, not the gateway restart: supplementary
# groups are fixed when user@<uid>.service starts, so restarting only the unit
# would not pick up the new group.
- name: Add openclaw user to systemd-journal group for read-only journal access
  ansible.builtin.user:
    name: "{{ openclaw_setup_user }}"
    groups: systemd-journal
    append: true
  notify: Restart openclaw user manager

- name: Get active groups for openclaw user
  ansible.builtin.command:
    cmd: "id -Gn {{ openclaw_setup_user }}"
  register: openclaw_setup_user_groups_cmd
  changed_when: false
  check_mode: false

- name: Assert openclaw user is not a member of privileged groups
  ansible.builtin.assert:
    that:
      - "'sudo' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'root' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'wheel' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'shadow' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'adm' not in openclaw_setup_user_groups_cmd.stdout.split()"
      - "'disk' not in openclaw_setup_user_groups_cmd.stdout.split()"
    fail_msg: "SECURITY VIOLATION: User {{ openclaw_setup_user }} belongs to a privileged group! Groups: {{ openclaw_setup_user_groups_cmd.stdout }}"
    success_msg: "Security assertion passed: User {{ openclaw_setup_user }} is not a member of any privileged groups."

- name: Check sudo privilege status for openclaw user
  ansible.builtin.command:
    cmd: "sudo -n -l -U {{ openclaw_setup_user }}"
  register: openclaw_setup_sudo_check
  changed_when: false
  failed_when: false
  check_mode: false


- name: Assert openclaw user has no sudo privileges
  ansible.builtin.assert:
    that:
      - >-
        openclaw_setup_sudo_check.rc != 0 or
        'not allowed to run sudo' in openclaw_setup_sudo_check.stderr or
        'not allowed to run sudo' in openclaw_setup_sudo_check.stdout
    fail_msg: "SECURITY VIOLATION: User {{ openclaw_setup_user }} has sudo privileges on this system!"
    success_msg: "Security assertion passed: User {{ openclaw_setup_user }} has no sudo privileges."

- name: Test existence of Oh My Zsh for openclaw user

  ansible.builtin.stat:
    path: "{{ openclaw_setup_home }}/.oh-my-zsh"
  register: openclaw_setup_omz_stat

- name: Download OMZ installation script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/omz-install.sh
    mode: '0755'
  when: not openclaw_setup_omz_stat.stat.exists

- name: Run OMZ installation script for openclaw user
  ansible.builtin.command: /tmp/omz-install.sh --unattended --keep-zshrc
  when: not openclaw_setup_omz_stat.stat.exists
  changed_when: true
  become: true
  become_user: "{{ openclaw_setup_user }}"

- name: Install dotfiles for openclaw user
  ansible.builtin.template:
    src: "{{ role_path }}/../master_setup/templates/dotfiles/{{ item }}"
    dest: "{{ openclaw_setup_home }}/{{ item }}"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0644'
  loop:
    - .bashrc
    - .gitignore_global
    - .profile
    - .zshrc
    - .gitconfig

# Created as the openclaw user so any missing parents (~/.cache/openclaw) are
# owned by it too.
- name: Create compilation cache directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_compile_cache }}"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'
  become: true
  become_user: "{{ openclaw_setup_user }}"

# The gateway's TMPDIR (see openclaw_setup_tmp_dir): private to the user, and it
# survives the service stop in the middle of an update, which a PrivateTmp /tmp
# would not.
- name: Create the OpenClaw gateway temporary directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_tmp_dir }}"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0700'
  become: true
  become_user: "{{ openclaw_setup_user }}"

# OpenClaw's preferred temp root is hard-coded to /tmp/openclaw (logs, claude-cli
# skill staging), independently of TMPDIR. Since the unit lost PrivateTmp (see
# docs/openclaw.md §4.1) that is the host's shared /tmp, emptied at every boot,
# where any other local account could create the directory first: the gateway
# would then either refuse it ("untrusted owner") or write into a directory it
# does not control. tmpfiles.d recreates it for the openclaw user at every boot,
# before the user manager starts, and re-asserts owner and mode if it exists.
- name: Reserve /tmp/openclaw for the openclaw user at boot
  ansible.builtin.copy:
    content: |
      # Managed by Ansible (openclaw_setup role). See docs/openclaw.md §4.1.
      d /tmp/openclaw 0700 {{ openclaw_setup_user }} {{ openclaw_setup_group }} -
    dest: /etc/tmpfiles.d/openclaw.conf
    owner: root
    group: root
    mode: '0644'
  register: openclaw_setup_tmpfiles_conf

# Applied right away rather than from a handler, so the directory is in place
# before the gateway restarts later in this play.
- name: Create /tmp/openclaw from the tmpfiles.d entry
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - /etc/tmpfiles.d/openclaw.conf
  when: openclaw_setup_tmpfiles_conf.changed  # noqa: no-handler
  changed_when: true

# Superseded by the cache under $HOME above; the old path sat behind the unit's
# former PrivateTmp and never reached the service anyway.
- name: Remove the legacy /var/tmp compile cache
  ansible.builtin.file:
    path: /var/tmp/openclaw-compile-cache
    state: absent

- name: Enable lingering for openclaw user
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ openclaw_setup_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ openclaw_setup_user }}"

- name: Create systemd user configuration directory
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.config/systemd/user"
    state: directory
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0755'
