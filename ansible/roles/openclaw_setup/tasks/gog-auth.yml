---
# gog's non-interactive OAuth authorization. See docs/openclaw.md §6.6.
#
# Runs after secrets-env.yml on purpose: every `gog` call here unlocks the
# keyring with GOG_KEYRING_PASSWORD, which it reads from /etc/openclaw/secrets.env
# through openclaw_setup_gog_argv (systemd-run + EnvironmentFile=) instead of an
# `environment:` entry on a `become_user` task. With `environment:`, Ansible puts
# the value on the `sudo` command line and sudo logs the whole line to the
# journal in clear (`no_log` only silences Ansible's own output); the password
# sat in the journal on every run. Never pass a secret that way in this role.

# The consumer below already skips once the keyring holds the credentials, via
# its `creates:`. This write had no equivalent guard, so every run wrote a temp
# file that nothing read and the next task deleted — two `changed` results per
# run, for no work. That noise meant a converged host never reported changed=0,
# which is exactly the signal the scheduled drift check exists to produce.
- name: Check whether gog OAuth client credentials are already stored
  ansible.builtin.stat:
    path: "{{ openclaw_setup_gog_credentials_path }}"
  become: true
  become_user: "{{ openclaw_setup_user }}"
  register: openclaw_setup_gog_credentials_stat
  when: openclaw_gog_oauth_client_json is defined

- name: Write gog OAuth client credentials to temp file for claw user
  ansible.builtin.copy:
    content: "{{ openclaw_gog_oauth_client_json }}"
    dest: "{{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
  become: true
  become_user: "{{ openclaw_setup_user }}"
  when:
    - openclaw_gog_oauth_client_json is defined
    - not openclaw_setup_gog_credentials_stat.stat.exists
  no_log: true

- name: Store gog OAuth client credentials for claw user
  ansible.builtin.command:
    argv: >-
      {{ openclaw_setup_gog_argv +
         ['--client', 'default', 'auth', 'credentials', 'set',
          openclaw_setup_home ~ '/.gog-oauth-client.json.tmp'] }}
  args:
    creates: "{{ openclaw_setup_gog_credentials_path }}"
  when: openclaw_gog_oauth_client_json is defined
  no_log: true

- name: Remove gog OAuth client credentials temp file
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.gog-oauth-client.json.tmp"
    state: absent

- name: Check existing gog auth accounts for claw user
  ansible.builtin.command:
    argv: "{{ openclaw_setup_gog_argv + ['auth', 'list', '--plain'] }}"
  register: openclaw_setup_gog_auth_list
  changed_when: false
  # `check_mode: false` below makes this probe run for real, including against a
  # host that has never been converged — where a --check run only *simulates*
  # the gog download/extract/symlink, so the binary is absent and this exits
  # 127. Without failed_when the play would hard-fail there, having previously
  # just skipped and carried on. Failing soft leaves stdout empty, which makes
  # the guard below fall through to "would import" — the correct signal.
  failed_when: false
  # Read-only, and it must run during a --check run: `command` is skipped in
  # check mode by default, which left `stdout` empty, made the guard below
  # ("account not in the list") trivially true, and reported a spurious change
  # on every check run. Same treatment as the other read-only probes in this
  # role.
  check_mode: false
  when: openclaw_gog_refresh_token_export_json is defined

- name: Write gog refresh token export to temp file for claw user
  ansible.builtin.copy:
    content: "{{ openclaw_gog_refresh_token_export_json }}"
    dest: "{{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
    owner: "{{ openclaw_setup_user }}"
    group: "{{ openclaw_setup_group }}"
    mode: '0600'
  become: true
  become_user: "{{ openclaw_setup_user }}"
  when: >-
    openclaw_gog_refresh_token_export_json is defined and
    openclaw_setup_gog_account_email not in openclaw_setup_gog_auth_list.stdout
  no_log: true

- name: Import gog refresh token for claw user
  ansible.builtin.command:
    argv: >-
      {{ openclaw_setup_gog_argv +
         ['auth', 'tokens', 'import', openclaw_setup_home ~ '/.gog-refresh-token.json.tmp'] }}
  when: >-
    openclaw_gog_refresh_token_export_json is defined and
    openclaw_setup_gog_account_email not in openclaw_setup_gog_auth_list.stdout
  changed_when: true
  no_log: true

- name: Remove gog refresh token temp file
  ansible.builtin.file:
    path: "{{ openclaw_setup_home }}/.gog-refresh-token.json.tmp"
    state: absent
