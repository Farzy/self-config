---
openclaw_setup_user: claw
openclaw_setup_group: claw
openclaw_setup_home: /home/claw
# Under $HOME rather than /var/tmp: the unit's PrivateTmp=true gives the gateway
# a private /var/tmp, so a cache there was never the host directory — it was an
# empty per-start copy thrown away on every restart. $HOME is already in the
# unit's ReadWritePaths, so no extra sandbox exception is needed either.
openclaw_setup_compile_cache: "{{ openclaw_setup_home }}/.cache/openclaw/compile-cache"

# TMPDIR for the gateway. Not the unit's PrivateTmp /tmp: systemd deletes that
# directory as soon as the service stops, and OpenClaw's update helper keeps its
# staged runtime, parameters and log under os.tmpdir() while it stops, swaps and
# restarts the very service that owns it. Kept 0700 under $HOME instead.
openclaw_setup_tmp_dir: "{{ openclaw_setup_home }}/.cache/openclaw/tmp"

# claw-owned npm global prefix OpenClaw is installed into, so its own updater —
# running as claw — can stage and swap the package tree (a root-owned
# /usr/lib/node_modules install can only ever be replaced by root). ~/.npm-global
# is one of the user bin roots OpenClaw's service PATH logic already knows.
# See docs/openclaw.md §4.4.
openclaw_setup_npm_prefix: "{{ openclaw_setup_home }}/.npm-global"

# Native OpenClaw service identity. OpenClaw's updater and Doctor only manage a
# systemd *user* unit with this exact name; they refuse to drive system-scope
# units, and treat a system unit named either this or the legacy
# `openclaw.service` as a conflicting owner. Not meant to be overridden.
openclaw_setup_systemd_unit: openclaw-gateway.service

# Release channel `openclaw update` (and the agent's `update.run`) follows.
# Background auto-updates stay disabled in openclaw.json.j2 regardless: updates
# only ever happen when explicitly requested. See docs/openclaw.md §4.4.
openclaw_setup_update_channel: stable
openclaw_setup_domain: claw.farzad.tech
openclaw_setup_avatar: ""

openclaw_setup_port: 18789
openclaw_setup_ssh_key: ""

# Where gog stores the OAuth client credentials once imported. Both the guard
# that decides whether to write the temp file and the `creates:` of the task
# that consumes it key off this exact path — hoisted here so the two cannot
# drift apart, since the whole point of the guard is that they match.
openclaw_setup_gog_credentials_path: "{{ openclaw_setup_home }}/.local/share/gogcli/credentials.json"

openclaw_setup_email: farzy@farzy.org
openclaw_setup_model: "anthropic/claude-sonnet-5"
openclaw_setup_claude_cli_enabled: true
openclaw_setup_model_fallbacks:
  - "google/gemini-3.1-pro-preview"
  - "scaleway/glm-5.2"
  - "scaleway/qwen3.6-35b-a3b"
openclaw_setup_reasoning_default: "stream"

openclaw_setup_scaleway_enabled: false
openclaw_setup_scaleway_project_id: ""
openclaw_setup_scaleway_api_key: ""
openclaw_setup_scaleway_api: "openai-responses"
openclaw_setup_scaleway_models:
  - id: "glm-5.2"
    name: "GLM 5.2"
  - id: "qwen3.6-35b-a3b"
    name: "Qwen 3.6"
  - id: "mistral-small-3.2-24b-instruct-2506"
    name: "Mistral Small 3"
# Scaleway model ids (without the "scaleway/" prefix) that get extended-thinking params
openclaw_setup_scaleway_reasoning_model_ids:
  - "glm-5.2"
  - "qwen3.6-35b-a3b"

openclaw_setup_signal_cli_version: "0.14.7"
openclaw_setup_signal_cli_path: "/usr/local/bin/signal-cli"
openclaw_setup_signal_account: ""
openclaw_setup_signal_allow_from: []

openclaw_setup_gog_cli_version: "0.37.0"
openclaw_setup_gog_cli_sha256: "905fed0bfabafa5dde7189e50642b3fa31d7fc4aad50a8d27d2b92071d875962"
# Account authorized non-interactively via openclaw_gog_oauth_client_json /
# openclaw_gog_refresh_token_export_json (ansible/vars/openclaw.yml) — see docs/openclaw.md 6.6.
openclaw_setup_gog_account_email: "farzad.farid@gmail.com"

openclaw_setup_telegram_enabled: true
openclaw_setup_telegram_allow_from: []
openclaw_setup_telegram_thread_bindings_enabled: true

openclaw_setup_allowed_origins:
  - "https://{{ openclaw_setup_domain }}"

openclaw_setup_memory_search_provider: "gemini"
openclaw_setup_memory_search_model: "gemini-embedding-001"
openclaw_setup_memory_search_extra_paths:
  - "{{ openclaw_setup_home }}/.openclaw/workspace/farzad-wiki"
openclaw_setup_dreaming_enabled: true
openclaw_setup_memory_wiki_enabled: true

# Blocks OpenClaw's own config writers (setup, doctor --fix, plugin
# install/update/enable/disable, `models auth paste-token`, mutating `update`
# flows) on the systemd-managed gateway process, via OPENCLAW_CONFIG_READONLY=1
# (openclaw-gateway.service.j2). Introduced in the 2026.9.4 release for
# deployments where config is externally managed.
#
# Off by default because it is incompatible with self-update: `openclaw update`
# refuses to start at all while it is set, and the update helper inherits the
# gateway's environment, so `update.run` from chat would be refused too. Setting
# it to true freezes the install at its current version (Ansible can still
# bootstrap an absent install, but not upgrade one). See docs/openclaw.md §4.3.
openclaw_setup_config_readonly: false

# Minimum OpenClaw version, not an exact pin. Ansible installs it when OpenClaw
# is absent and upgrades to it (through OpenClaw's own updater) when the host is
# older, but never downgrades: once a newer release has migrated the SQLite
# state, an older package cannot be restored safely. A host that self-updated
# past this value fails the play until it is bumped — see docs/openclaw.md §4.4.
openclaw_setup_version: "2026.9.4"
