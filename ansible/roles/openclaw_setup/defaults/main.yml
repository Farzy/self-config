---
openclaw_setup_user: claw
openclaw_setup_group: claw
openclaw_setup_home: /home/claw
openclaw_setup_compile_cache: /var/tmp/openclaw-compile-cache
openclaw_setup_domain: claw.farzad.tech
openclaw_setup_avatar: ""

openclaw_setup_port: 18789
openclaw_setup_ssh_key: ""

# Where gog stores the OAuth client credentials once imported. Both the guard
# that decides whether to write the temp file and the `creates:` of the task
# that consumes it key off this exact path — hoisted here so the two cannot
# drift apart, since the whole point of the guard is that they match.
openclaw_setup_gog_credentials_path: "{{ openclaw_setup_home }}/.local/share/gogcli/credentials.json"

openclaw_setup_email: farzy@farzy.org
openclaw_setup_model: "anthropic/claude-sonnet-5"
openclaw_setup_claude_cli_enabled: true
openclaw_setup_model_fallbacks:
  - "google/gemini-3.1-pro-preview"
  - "scaleway/glm-5.2"
  - "scaleway/qwen3.6-35b-a3b"
openclaw_setup_reasoning_default: "stream"

openclaw_setup_scaleway_enabled: false
openclaw_setup_scaleway_project_id: ""
openclaw_setup_scaleway_api_key: ""
openclaw_setup_scaleway_api: "openai-responses"
openclaw_setup_scaleway_models:
  - id: "glm-5.2"
    name: "GLM 5.2"
  - id: "qwen3.6-35b-a3b"
    name: "Qwen 3.6"
  - id: "mistral-small-3.2-24b-instruct-2506"
    name: "Mistral Small 3"
# Scaleway model ids (without the "scaleway/" prefix) that get extended-thinking params
openclaw_setup_scaleway_reasoning_model_ids:
  - "glm-5.2"
  - "qwen3.6-35b-a3b"

openclaw_setup_signal_cli_version: "0.14.7"
openclaw_setup_signal_account: ""
openclaw_setup_signal_allow_from: []

openclaw_setup_gog_cli_version: "0.37.0"
openclaw_setup_gog_cli_sha256: "905fed0bfabafa5dde7189e50642b3fa31d7fc4aad50a8d27d2b92071d875962"
# Account authorized non-interactively via openclaw_gog_oauth_client_json /
# openclaw_gog_refresh_token_export_json (ansible/vars/openclaw.yml) — see docs/openclaw.md 6.6.
openclaw_setup_gog_account_email: "farzad.farid@gmail.com"

openclaw_setup_telegram_enabled: true
openclaw_setup_telegram_allow_from: []
openclaw_setup_telegram_thread_bindings_enabled: true

openclaw_setup_allowed_origins:
  - "https://{{ openclaw_setup_domain }}"

openclaw_setup_memory_search_provider: "gemini"
openclaw_setup_memory_search_model: "gemini-embedding-001"
openclaw_setup_memory_search_extra_paths:
  - "{{ openclaw_setup_home }}/.openclaw/workspace/farzad-wiki"
openclaw_setup_dreaming_enabled: true
openclaw_setup_memory_wiki_enabled: true

openclaw_setup_version: "2026.8.1"
