---
- name: Sysctl settings for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - name: fs.inotify.max_user_watches
      value: 524288
    - name: fs.inotify.max_user_instances
      value: 512

- name: Install required system packages
  ansible.builtin.apt:
    pkg:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - software-properties-common
      - python3-pip
      - virtualenv
      - python3-setuptools
      # Required on the managed node by ansible.builtin.deb822_repository,
      # which replaces the deprecated apt_key/apt_repository below.
      # A first `--check` run on a host without it fails at the repository task
      # below: check mode only simulates this install, so deb822_repository
      # still finds the library missing. Expected, not a regression.
      - python3-debian
    state: present
    update_cache: true

# apt_key and apt_repository are both deprecated and removed in ansible-core
# 2.25. deb822_repository replaces the pair: it carries the signing key with the
# repository definition, so the key is scoped to this one source instead of
# being trusted for every repository on the host — which is the actual reason
# apt_key is going away.
- name: Add Docker Repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_distribution_release }}"]
    components: [stable]
    architectures: [amd64]
    signed_by: https://download.docker.com/linux/debian/gpg
    state: present

# deb822_repository writes docker.sources, and any leftover .list would be read
# alongside it — apt would then have the repository configured twice. Two names
# are possible and both are cleaned up:
#
#   download_docker_com_linux_debian.list
#     what this role's own apt_repository task wrote. With no `filename:` given,
#     apt_repository derives one via `_suggest_filename`: strip the options
#     block and the scheme, keep the first field, replace every non-alphanumeric
#     character with an underscore.
#
#   docker.list
#     what Docker's own documented install writes, and what is actually on disk
#     on every host checked (minecraft-01, claw). So in practice this is the one
#     that matters — the derived name was a plausible guess that the hosts
#     disagree with.
- name: Remove any superseded Docker .list definition
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop:
    - download_docker_com_linux_debian.list
    - docker.list

# NOTE: apt_key will also have left the Docker key in /etc/apt/trusted.gpg,
# where it is trusted to sign any repository. It is deliberately NOT removed
# here, unlike in openclaw_setup: there, that keyring was verified to hold
# nothing but the one key being replaced. On these hosts it may well hold other
# keys, and deleting it would break every repository relying on them. Check with
# `apt-key list` and remove the specific key by fingerprint if you want the
# cleanup.

- name: Update apt and install docker-ce
  ansible.builtin.apt:
    name: docker-ce
    state: present
    update_cache: true

- name: Make main user Docker admin
  ansible.builtin.user:
    append: true
    name: "{{ user_owner }}"
    groups:
      - docker
