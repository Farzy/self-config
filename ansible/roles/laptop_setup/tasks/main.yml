---
- name: Set hostname
  ansible.builtin.include_tasks:
    file: hostname.yml
  tags:
    - always
    - hostname

- name: Install packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: packages
  tags: packages

- name: Configure SSH
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: ssh
  tags: ssh

- name: List installed Helm plugins
  ansible.builtin.shell: |
    set -o pipefail
    helm plugin list | tail -n +2 | cut -f 1
  args:
    executable: /bin/bash
  register: helm_plugins
  check_mode: false
  changed_when: false
  tags:
    - packages
    - helm

- name: Install Helm plugins
  ansible.builtin.shell:
    cmd: "helm plugin install {{ item.url }} || helm plugin update {{ item.name }}"
  loop:
    - url: https://github.com/hypnoglow/helm-s3.git
      name: s3
  when: item.name not in helm_plugins.stdout
  changed_when: true
  tags:
    - packages
    - helm

- name: Install Oh My Zsh and configure ZSH
  ansible.builtin.include_tasks:
    file: zsh.yml
    apply:
      tags: zsh
  tags: zsh

# Change Ansible/Jinja block delimiters in order to avoid issues with shell
# syntax '${%…}'.
- name: "Install personal config files"
  ansible.builtin.template:
    src: "dotfiles/{{ item }}"
    dest: "~/{{ item }}"
    mode: '0644'
    block_start_string: "{|"
    block_end_string: "|}"
  loop:
    - .gitconfig
    - .gitconfig-personal
    - .gitconfig-professional
    - .gitignore_global
    - .tmux.conf
    - .zshrc
  tags:
    - configuration
    - zsh

- name: Create iTerm2 DynamicProfiles
  ansible.builtin.template:
    src: "iTerm2/personal.json.j2"
    dest: "{{ iterm2_library_path }}/DynamicProfiles/personal.json"
    mode: '0644'
  tags:
    - configuration
    - iterm2
  when: is_macos

- name: Create .gemini directory
  ansible.builtin.file:
    path: "~/.gemini"
    state: directory
    mode: "0755"
  tags:
    - configuration
    - ai

- name: Install personal AGENTS.md to ~/.gemini
  ansible.builtin.template:
    src: "ai/AGENTS_personal.md.j2"
    dest: "~/.gemini/AGENTS.md"
    mode: "0644"
  tags:
    - configuration
    - ai
  when: integration_personal_laptop | default(false)

- name: Install professional AGENTS.md to ~/.gemini
  ansible.builtin.template:
    src: "ai/AGENTS_professional.md.j2"
    dest: "~/.gemini/AGENTS.md"
    mode: "0644"
  tags:
    - configuration
    - ai
  when: integration_market_pay | default(false)

- name: Create .claude directory
  ansible.builtin.file:
    path: "~/.claude"
    state: directory
    mode: "0755"
  tags:
    - configuration
    - ai

- name: Install professional CLAUDE.md to ~/.claude
  ansible.builtin.template:
    src: "ai/CLAUDE_professional.md.j2"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  tags:
    - configuration
    - ai
  when: integration_market_pay | default(false)

# Gated on claude_personal_md_ready (see vars/laptop.yml) so this can be
# scaffolded ahead of the real content: CLAUDE_personal.md.j2 starts out as a
# placeholder, and applying it for real before it's seeded would overwrite
# whatever is currently at ~/.claude/CLAUDE.md on the personal laptop. Use the
# "ai-drift" trace tasks below to compare the placeholder against the live
# file before flipping the flag.
- name: Install personal CLAUDE.md to ~/.claude
  ansible.builtin.template:
    src: "ai/CLAUDE_personal.md.j2"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  tags:
    - configuration
    - ai
  when: integration_personal_laptop | default(false) and claude_personal_md_ready | default(false)

# Read-only drift check for both CLAUDE.md variants: check_mode/diff are set
# on the task itself, so it never writes regardless of CLI flags, and always
# shows a diff. Tagged "never" so it's excluded from normal runs (including
# --tags all) and only fires when "ai-drift" is requested explicitly, e.g.:
#   ansible-playbook --limit <host> -t ai-drift playbooks/laptop.yml
#
# WARNING: diff: true here prints the vault-decrypted template content to the
# terminal. Only run this locally -- never in CI or anywhere logs are kept.
- name: "Trace drift: professional CLAUDE.md (read-only, never writes)"
  ansible.builtin.template:
    src: "ai/CLAUDE_professional.md.j2"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  check_mode: true
  diff: true
  when: integration_market_pay | default(false)
  tags:
    - never
    - ai-drift

- name: "Trace drift: personal CLAUDE.md (read-only, never writes)"
  ansible.builtin.template:
    src: "ai/CLAUDE_personal.md.j2"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  check_mode: true
  diff: true
  when: integration_personal_laptop | default(false)
  tags:
    - never
    - ai-drift
