---
- name: Set hostname
  ansible.builtin.include_tasks:
    file: hostname.yml
  tags:
    - always
    - hostname

- name: Install packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: packages
  tags: packages

- name: Configure SSH
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: ssh
  tags: ssh

- name: List installed Helm plugins
  ansible.builtin.shell: |
    set -o pipefail
    helm plugin list | tail -n +2 | cut -f 1
  args:
    executable: /bin/bash
  register: helm_plugins
  check_mode: false
  changed_when: false
  tags:
    - packages
    - helm

- name: Install Helm plugins
  ansible.builtin.shell:
    cmd: "helm plugin install {{ item.url }} || helm plugin update {{ item.name }}"
  loop:
    - url: https://github.com/hypnoglow/helm-s3.git
      name: s3
  when: item.name not in helm_plugins.stdout
  changed_when: true
  tags:
    - packages
    - helm

- name: Install Oh My Zsh and configure ZSH
  ansible.builtin.include_tasks:
    file: zsh.yml
    apply:
      tags: zsh
  tags: zsh

# Change Ansible/Jinja block delimiters in order to avoid issues with shell
# syntax '${%…}'.
- name: "Install personal config files"
  ansible.builtin.template:
    src: "dotfiles/{{ item }}"
    dest: "~/{{ item }}"
    mode: '0644'
    block_start_string: "{|"
    block_end_string: "|}"
  loop:
    - .gitconfig
    - .gitconfig-personal
    - .gitconfig-professional
    - .gitignore_global
    - .tmux.conf
    - .zshrc
  tags:
    - configuration
    - zsh

- name: Create iTerm2 DynamicProfiles
  ansible.builtin.template:
    src: "iTerm2/personal.json.j2"
    dest: "{{ iterm2_library_path }}/DynamicProfiles/personal.json"
    mode: '0644'
  tags:
    - configuration
    - iterm2
  when: is_macos

- name: Create .gemini directory
  ansible.builtin.file:
    path: "~/.gemini"
    state: directory
    mode: "0755"
  tags:
    - configuration
    - ai

- name: Install personal AGENTS.md to ~/.gemini
  ansible.builtin.copy:
    src: "ai/AGENTS_personal.md"
    dest: "~/.gemini/AGENTS.md"
    mode: "0644"
  tags:
    - configuration
    - ai
  when: integration_personal_laptop | default(false)

- name: Install professional AGENTS.md to ~/.gemini
  ansible.builtin.copy:
    src: "ai/AGENTS_professional.md"
    dest: "~/.gemini/AGENTS.md"
    mode: "0644"
  tags:
    - configuration
    - ai
  when: integration_market_pay | default(false)

- name: Create .claude directory
  ansible.builtin.file:
    path: "~/.claude"
    state: directory
    mode: "0755"
  tags:
    - configuration
    - ai
    - ai-claude-write

# ~/.claude/CLAUDE.md (both variants) is never overwritten by a normal apply.
# The "Check for changes" tasks below always run in check_mode with
# diff: true set directly on the task, so every run -- with or without
# --check/--diff on the command line -- shows what would change but never
# writes. Installing for real requires explicitly opting in with the
# "ai-claude-write" tag, e.g.:
#   ansible-playbook --limit <host> -t ai-claude-write playbooks/laptop.yml
# Those install tasks are also tagged "never" so they're excluded even from
# --tags all. "ai-drift" is a narrower alias for just the two check tasks,
# for a dry run that skips the rest of "ai"/"configuration".
#
# WARNING: diff: true here prints the vault-decrypted file content to the
# terminal. Only run this locally -- never in CI or anywhere logs are kept.
- name: "Check for changes: professional CLAUDE.md (read-only, never writes)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_professional.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  check_mode: true
  diff: true
  register: claude_professional_check
  when: integration_market_pay | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "CLAUDE.md (professional) differs -- pass -t ai-claude-write to apply"
  ansible.builtin.debug:
    msg: >-
      ~/.claude/CLAUDE.md differs from the committed professional file (see
      diff above). Re-run with `--tags ai-claude-write` to install it.
  when:
    - integration_market_pay | default(false)
    - claude_professional_check.changed | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "Install professional CLAUDE.md to ~/.claude (writes; opt-in)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_professional.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  when: integration_market_pay | default(false)
  tags:
    - never
    - ai-claude-write

- name: "Check for changes: personal CLAUDE.md (read-only, never writes)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_personal.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  check_mode: true
  diff: true
  register: claude_personal_check
  when: integration_personal_laptop | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "CLAUDE.md (personal) differs -- pass -t ai-claude-write to apply"
  ansible.builtin.debug:
    msg: >-
      ~/.claude/CLAUDE.md differs from the committed personal file (see diff
      above). Re-run with `--tags ai-claude-write` to install it.
  when:
    - integration_personal_laptop | default(false)
    - claude_personal_check.changed | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "Install personal CLAUDE.md to ~/.claude (writes; opt-in)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_personal.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  when: integration_personal_laptop | default(false)
  tags:
    - never
    - ai-claude-write
