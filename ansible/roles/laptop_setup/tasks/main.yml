---
# homebrew_prefix is detected from the presence of arm Homebrew, NOT from the
# hardware: this playbook is only ever run on a machine that already has
# Homebrew, because its own toolchain depends on it -- ansible <- uv <- Homebrew,
# with Homebrew bootstrapped by hand first. So "is arm Homebrew installed" and
# "is this Apple Silicon" are the same question here. (`brew --prefix` is
# PATH-dependent and unreliable from a non-login shell; ansible_facts's
# architecture reads x86_64 whenever Ansible's Python runs under Rosetta.)
- name: Detect Apple Silicon Homebrew
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: _brew_arm
  when: is_macos
  tags: always

- name: Set homebrew_prefix fact
  ansible.builtin.set_fact:
    homebrew_prefix: "{{ '/opt/homebrew' if _brew_arm.stat.exists else '/usr/local' }}"
  when: is_macos
  tags: always

# Enable Touch ID for `sudo`. macOS 14+ sources /etc/pam.d/sudo_local from
# /etc/pam.d/sudo, and that include survives OS updates -- unlike editing
# /etc/pam.d/sudo directly, which every major update reverts. Apple ships
# /etc/pam.d/sudo_local.template (its existence is our "mechanism present"
# probe); we write the same file with the pam_tid line uncommented.
#
# This is opt-in only. "Enable Touch ID for sudo" is tagged `never`, so a normal
# run skips it entirely -- it needs root, which would prompt for a sudo password
# (or, once configured, Touch ID) on every unrelated `ansible-playbook` run.
# Apply it deliberately:
#
#   ansible-playbook --ask-become-pass --tags sudo playbooks/laptop.yml
#
# Both tasks are `never` + `sudo`: skipped everywhere except that explicit
# `--tags sudo` invocation, which pulls them both back in.
#
# The laptop hosts carry `ansible_become=false` in ./hosts (they are
# ansible_connection=local and nothing else here needs root). That inventory
# variable outranks a `become: true` task keyword, so the write task re-asserts
# escalation with a task-level `ansible_become` var, which outranks inventory.
- name: Check for the sudo_local include mechanism (macOS 14+)
  ansible.builtin.stat:
    path: /etc/pam.d/sudo_local.template
  register: _sudo_local_template
  when: is_macos
  tags:
    - never
    - sudo

- name: Enable Touch ID for sudo
  ansible.builtin.copy:
    dest: /etc/pam.d/sudo_local
    # pam_reattach (auth optional, listed before pam_tid) would extend Touch ID
    # to tmux/screen sessions -- it needs `brew install pam-reattach`, so it is
    # left out of the default managed file.
    content: |
      # Managed by Ansible (laptop_setup) -- Touch ID for sudo.
      auth       sufficient     pam_tid.so
    owner: root
    group: wheel
    mode: "0444"
  become: true
  vars:
    ansible_become: true
  when: is_macos and _sudo_local_template.stat.exists | default(false)
  tags:
    - never
    - sudo

- name: Set hostname
  ansible.builtin.include_tasks:
    file: hostname.yml
  tags:
    - always
    - hostname

- name: Install packages
  ansible.builtin.include_tasks:
    file: packages.yml
    apply:
      tags: packages
  tags: packages

- name: Configure SSH
  ansible.builtin.include_tasks:
    file: ssh.yml
    apply:
      tags: ssh
  tags: ssh

- name: List installed Helm plugins
  ansible.builtin.shell: |
    set -o pipefail
    helm plugin list | tail -n +2 | cut -f 1
  args:
    executable: /bin/bash
  register: helm_plugins
  check_mode: false
  changed_when: false
  tags:
    - packages
    - helm

- name: Install Helm plugins
  ansible.builtin.shell:
    cmd: "helm plugin install {{ item.url }} || helm plugin update {{ item.name }}"
  loop:
    - url: https://github.com/hypnoglow/helm-s3.git
      name: s3
  when: item.name not in helm_plugins.stdout
  changed_when: true
  tags:
    - packages
    - helm

# The `nvm` Homebrew formula keeps its version store in $NVM_DIR (~/.nvm) but
# ships nvm.sh under the Cellar. Point ~/.nvm/nvm.sh + nvm-exec at the current
# Homebrew prefix so the oh-my-zsh nvm plugin (which sources $NVM_DIR/nvm.sh)
# loads the native build and node installs survive `brew upgrade nvm`.
- name: Ensure NVM_DIR (~/.nvm) exists
  ansible.builtin.file:
    path: "~/.nvm"
    state: directory
    mode: "0755"
  tags:
    - packages
    - configuration
  when: is_macos

- name: Stat the Homebrew nvm loader
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/opt/nvm/libexec/nvm.sh"
  register: _brew_nvm
  tags:
    - packages
    - configuration
  when: is_macos

- name: Link ~/.nvm shims to the Homebrew nvm
  ansible.builtin.file:
    src: "{{ homebrew_prefix }}/opt/nvm/libexec/{{ item }}"
    dest: "~/.nvm/{{ item }}"
    state: link
    force: true
  loop:
    - nvm.sh
    - nvm-exec
  tags:
    - packages
    - configuration
  # `force: true` would happily create a link to a nonexistent target, which
  # makes the oh-my-zsh nvm plugin silently skip loading. Only link once the
  # formula is actually installed (i.e. after a `-t packages` run).
  when: is_macos and _brew_nvm.stat.exists | default(false)

- name: Install Oh My Zsh and configure ZSH
  ansible.builtin.include_tasks:
    file: zsh.yml
    apply:
      tags: zsh
  tags: zsh

# Change Ansible/Jinja block delimiters in order to avoid issues with shell
# syntax '${%…}'.
- name: "Install personal config files"
  ansible.builtin.template:
    src: "dotfiles/{{ item }}"
    dest: "~/{{ item }}"
    mode: '0644'
    block_start_string: "{|"
    block_end_string: "|}"
  loop:
    - .gitconfig
    - .gitconfig-personal
    - .gitconfig-professional
    - .gitignore_global
    - .tmux.conf
    - .zshrc
  tags:
    - configuration
    - zsh

- name: Create iTerm2 DynamicProfiles
  ansible.builtin.template:
    src: "iTerm2/personal.json.j2"
    dest: "{{ iterm2_library_path }}/DynamicProfiles/personal.json"
    mode: '0644'
  tags:
    - configuration
    - iterm2
  when: is_macos

- name: Create .gemini directory
  ansible.builtin.file:
    path: "~/.gemini"
    state: directory
    mode: "0755"
  tags:
    - configuration
    - ai

- name: Install personal AGENTS.md to ~/.gemini
  ansible.builtin.copy:
    src: "ai/AGENTS_personal.md"
    dest: "~/.gemini/AGENTS.md"
    mode: "0644"
  tags:
    - configuration
    - ai
  when: integration_personal_laptop | default(false)

- name: Install professional AGENTS.md to ~/.gemini
  ansible.builtin.copy:
    src: "ai/AGENTS_professional.md"
    dest: "~/.gemini/AGENTS.md"
    mode: "0644"
  tags:
    - configuration
    - ai
  when: integration_market_pay | default(false)

- name: Create .claude directory
  ansible.builtin.file:
    path: "~/.claude"
    state: directory
    mode: "0755"
  tags:
    - configuration
    - ai
    - ai-claude-write

# ~/.claude/CLAUDE.md (both variants) is never overwritten by a normal apply.
# The "Check for changes" tasks below always run in check_mode with
# diff: true set directly on the task, so every run -- with or without
# --check/--diff on the command line -- shows what would change but never
# writes. Installing for real requires explicitly opting in with the
# "ai-claude-write" tag, e.g.:
#   ansible-playbook --limit <host> -t ai-claude-write playbooks/laptop.yml
# Those install tasks are also tagged "never" so they're excluded even from
# --tags all. "ai-drift" is a narrower alias for just the two check tasks,
# for a dry run that skips the rest of "ai"/"configuration".
#
# WARNING: diff: true here prints the vault-decrypted file content to the
# terminal. Only run this locally -- never in CI or anywhere logs are kept.
- name: "Check for changes: professional CLAUDE.md (read-only, never writes)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_professional.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  check_mode: true
  diff: true
  register: claude_professional_check
  when: integration_market_pay | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "CLAUDE.md (professional) differs -- pass -t ai-claude-write to apply"
  ansible.builtin.debug:
    msg: >-
      ~/.claude/CLAUDE.md differs from the committed professional file (see
      diff above). Re-run with `--tags ai-claude-write` to install it.
  when:
    - integration_market_pay | default(false)
    - claude_professional_check.changed | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "Install professional CLAUDE.md to ~/.claude (writes; opt-in)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_professional.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  when: integration_market_pay | default(false)
  tags:
    - never
    - ai-claude-write

- name: "Check for changes: personal CLAUDE.md (read-only, never writes)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_personal.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  check_mode: true
  diff: true
  register: claude_personal_check
  when: integration_personal_laptop | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "CLAUDE.md (personal) differs -- pass -t ai-claude-write to apply"
  ansible.builtin.debug:
    msg: >-
      ~/.claude/CLAUDE.md differs from the committed personal file (see diff
      above). Re-run with `--tags ai-claude-write` to install it.
  when:
    - integration_personal_laptop | default(false)
    - claude_personal_check.changed | default(false)
  tags:
    - configuration
    - ai
    - ai-drift

- name: "Install personal CLAUDE.md to ~/.claude (writes; opt-in)"
  ansible.builtin.copy:
    src: "ai/CLAUDE_personal.md"
    dest: "{{ claude_md_dest }}"
    mode: "{{ claude_md_mode }}"
  when: integration_personal_laptop | default(false)
  tags:
    - never
    - ai-claude-write
