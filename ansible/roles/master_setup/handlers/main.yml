---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  # Same check-mode guard as the "Ensure fail2ban is enabled" task: the unit does
  # not exist yet on a host where the install is only simulated.
  when: not (ansible_check_mode and master_setup_fail2ban_install is changed)

# Reload, not restart: sshd re-reads its configuration and keeps the sessions that
# are already open, so a bad change cannot cut off the operator who applied it.
- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
