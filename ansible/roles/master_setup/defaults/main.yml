---

master_setup_is_debian_lower_12: "{{ ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] | int < 12 }}"

# `master_setup_global_etcfiles` was removed: files/etcfiles/ is now transferred
# to /etc/ wholesale with a single rsync (see tasks/debian.yml), so the
# directory is its own source of truth and cannot drift from a hand-kept list.
# Every file it held was 0644, which rsync reproduces from the source mode.
master_setup_global_apt_repositories:
  - repo: 'deb http://ftp.debian.org/debian jessie-backports main contrib non-free'
    state: present
    filename: 'jessie-backports'
  - repo: "deb [arch=amd64,i386] http://ftp.igh.cnrs.fr/pub/mariadb/repo/10.1/debian jessie main"
    filename: "mariadb"
master_setup_global_apt_keys:
  - keyserver: "hkp://keyserver.ubuntu.com:80"
    id: "0xcbcb082a1bb943db"
master_setup_global_debconf_defaults:
  - name: debconf
    question: "debconf/priority"
    value: low
    vtype: select
  - name: debconf
    question: debconf/frontend
    value: Noninteractive
    vtype: select
  - name: postfix
    question: "postfix/mailname"
    value: "farzy.org"
    vtype: string
  - name: locales
    question: locales/default_environment_locale
    value: en_US.UTF-8
    vtype: select
  - name: locales
    question: locales/locales_to_be_generated
    value: "en_US.UTF-8 UTF-8"
    vtype: multiselect
master_setup_global_packages_apt:
  - bash-completion
  - bat
  - bzip2
  - debconf
  - deborphan
  - dlocate
  - dnsutils
  - elinks
  - fd-find
  - git
  - jq
  - htop
  - less
  - locales
  - lsof
  - ltrace
  - mlocate
  - mmv
  - mtr
  - ncdu
  - nmap
  - python3-pip
  - ripgrep
  - rsync

  - screen
  - strace
  - tcpdump
  - tmux
  - traceroute
  - tshark
  - unattended-upgrades
  - unzip
  - vim
  - wdiff
  - "{{ 'yq' if not master_setup_is_debian_lower_12 else omit }}"
  - zip
  - zoxide
  - zsh
# Only for Debian < 12
master_setup_global_packages_pip_system:
  - yq

master_setup_user_home: /home/debian
master_setup_user_owner: debian
master_setup_user_group: debian
master_setup_user_dotfiles:
  - name: .bashrc
  - name: .gitignore_global
  - name: .profile
  - name: .zshrc

master_setup_install_microk8s: false

# --- unattended-upgrades (rendered to /etc/apt/apt.conf.d/50unattended-upgrades) ---

# Also auto-upgrade packages from third-party APT repositories (Docker,
# NodeSource, GitHub CLI...), not just Debian's own. Off by default because an
# unattended Docker upgrade restarts dockerd and, without `live-restore`, every
# container on the host; every playbook in this repository turns it on.
master_setup_unattended_third_party: false

# `Origins-Pattern` entries added when the flag above is on. Values come from
# the `Origin:`/`Label:` fields of each repository's InRelease file. A pattern
# that matches nothing on a given host is harmless, so this one list serves
# every server. NodeSource pins the major stream in its repository URL
# (node_26.x), so this never crosses a Node major version.
master_setup_unattended_third_party_origins:
  - "origin=Docker,label=Docker CE"
  - "origin=. nodistro,label=. nodistro"
  - "origin=gh,label=gh"

# Reboot automatically when an upgrade leaves /var/run/reboot-required behind
# (typically a new kernel). Without it the fix is installed but not running.
master_setup_unattended_auto_reboot: true

# When the upgrade itself runs (apt-daily-upgrade.timer), in the host's local
# time (UTC on the servers). Debian's default is 06:00 plus up to an hour of
# random delay; it is pinned to the small window below so that the reboot below
# follows the upgrade within the same night instead of a day later.
master_setup_unattended_upgrade_time: "02:00"
master_setup_unattended_upgrade_random_delay: 15m

# When to reboot after an upgrade left /var/run/reboot-required behind, in the
# host's local time. unattended-upgrade schedules it with `shutdown -r <time>`
# at the end of its own run, so this must fall after the upgrade window above
# (02:00 + delay + install time), otherwise it waits for the next day's 03:30.
master_setup_unattended_reboot_time: "03:30"

# Reboot even if someone is logged in. False makes unattended-upgrade skip the
# reboot when a session is open *at the end of the upgrade run* (~02:00-02:30);
# it is not re-checked at reboot time, so a session opened after that is still
# cut short at 03:30. A skipped reboot is retried by the next night's run.
master_setup_unattended_reboot_with_users: false

# --- fail2ban (SSH brute-force protection) ---

# Install fail2ban and manage /etc/fail2ban/jail.local (sshd jail only). The
# servers are on the public internet and see tens of thousands of SSH login
# attempts a day, enough to exhaust sshd's MaxStartups and drop legitimate
# connections. Successful key logins never count, so CI deploys are unaffected.
master_setup_fail2ban: true

# Addresses never banned (in addition to loopback), as IPs or CIDRs.
master_setup_fail2ban_ignoreip: []

# `maxretry` failures within `findtime` earn a ban of `bantime`; repeat
# offenders double up to `bantime_max`. Times accept fail2ban suffixes (s, m, h, d, w).
master_setup_fail2ban_maxretry: 5
master_setup_fail2ban_findtime: 10m
master_setup_fail2ban_bantime: 1h
master_setup_fail2ban_bantime_max: 1w

# --- sshd ---

# Manage sshd's PasswordAuthentication through a drop-in
# (/etc/ssh/sshd_config.d/10-password-auth.conf). `null` (default) leaves sshd
# alone, `false` forbids password logins, `true` allows them. Opt-in per
# playbook rather than a default: turning passwords off on a host that has no
# working key for its accounts would lock everyone out. Include is at the top of
# Debian's sshd_config, so this drop-in wins over the compiled-in default.
master_setup_sshd_password_auth: null

# Public SSH keys authorised for the unattended CI deploy account (the account
# GitHub Actions connects as, i.e. the host's `ansible_user`). Public keys are
# not secrets, so these live in plain text in the per-host vars files.
#
# Empty by default: hosts that are not driven from CI get no extra key. See
# `docs/ci-ansible.md` for the bootstrap procedure — the first key has to be
# installed by hand, because CI cannot log in to install its own key.
master_setup_ci_authorized_keys: []

# Account the CI keys above are installed for: the inventory's `ansible_user`,
# which is exactly the account CI authenticates as.
#
# `| mandatory` rather than `| default('root')` on purpose. A host added to the
# inventory without an explicit `ansible_user` would otherwise silently
# authorise the CI key for *root* — the inverse of the least-privilege intent,
# with nothing in the output to notice. Failing loudly is the safer default.
# Only templated when master_setup_ci_authorized_keys is non-empty, so hosts
# that are not CI-managed are unaffected.
master_setup_ci_authorized_keys_user: "{{ ansible_user | mandatory }}"

# Set to true to make the CI account's authorized_keys file *exactly*
# `master_setup_ci_authorized_keys`, purging any key added out of band. Left
# false by default so that a mistake here cannot lock you out of your own
# server; turn it on once you trust the list.
master_setup_ci_authorized_keys_exclusive: false
