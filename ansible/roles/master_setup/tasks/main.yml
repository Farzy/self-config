# Keeps the key GitHub Actions logs in with under configuration management, so
# that rotating or revoking it is a reviewed commit rather than a manual edit on
# the box. Passing every key in a single `key:` value (newline separated) rather
# than looping is what makes `exclusive` behave: with a loop, exclusive mode
# would keep only the last iteration's key and drop the rest.
- name: Authorise CI deploy keys for the unattended deploy account
  ansible.posix.authorized_key:
    user: "{{ master_setup_ci_authorized_keys_user }}"
    key: "{{ master_setup_ci_authorized_keys | join('\n') }}"
    exclusive: "{{ master_setup_ci_authorized_keys_exclusive }}"
    state: present
  when: master_setup_ci_authorized_keys | length > 0
  tags:
    - configuration
    - ci_access

- name: Include Debian specific tasks
  ansible.builtin.include_tasks:
    file: debian.yml
    apply:
      tags:
        - debian
  tags:
    - debian

# - name: Install Git config
#   template: src=gitconfig.j2 dest={{ me.home }}/.gitconfig mode="0600" owner=farzy group=farzy
#   tags: configuration

- name: Include Zsh specific tasks
  ansible.builtin.include_tasks:
    file: zsh.yml
    apply:
      tags:
        - zsh
  tags:
    - zsh

- name: Include user configuration tasks
  ansible.builtin.include_tasks:
    file: user-config.yml
    apply:
      tags:
        - configuration
  tags:
    - configuration

