---

- name: Setup Debian packages configuration (debconf)
  ansible.builtin.debconf:
    name: "{{ item.name }}"
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop: "{{ master_setup_global_debconf_defaults }}"
  tags: configuration

- name: Force LANG to en_US
  ansible.builtin.blockinfile:
    path: /etc/environment
    block: |
      LANG=en_US.UTF-8
      LC_ALL=en_US.UTF-8
  tags: configuration

- name: Install packages
  ansible.builtin.apt:
    name: "{{ master_setup_global_packages_apt | reject('equalto', omit) | list }}"
    state: present
  tags: packages

- name: Create short-name symlinks for Debian tool renames (bat, fd)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: '/usr/bin/batcat', dest: '/usr/local/bin/bat' }
    - { src: '/usr/bin/fdfind', dest: '/usr/local/bin/fd' }
  tags: packages


# TODO Option "--system" does not work on Debian 12 Bookworm, and "yq" is available as APT package
- name: Install system Pip packages
  ansible.builtin.pip:
    name: "{{ master_setup_global_packages_pip_system }}"
    state: present
    extra_args: "--system"
  tags: packages
  when: master_setup_is_debian_lower_12

# One rsync instead of one `copy` per file, for the same reason as
# iterm2_integration: each module call costs a full round trip (~2.25s from a
# GitHub runner), so a five-item loop spent ~10s doing nothing.
#
# Faithful conversion: files/etcfiles/ mirrors /etc/ exactly, contains precisely
# the five files the old loop listed, and every one of them is 0644 root:root —
# so `perms: true` reproduces the old `mode` and rsync running as root under
# sudo reproduces the old `owner`/`group`. There is no `--delete`, so nothing
# else in /etc is touched.
- name: Install global /etc files
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/etcfiles/"
    dest: /etc/
    # `archive` would add -og and push the controller's owner/group, which never
    # match and would make every run report `changed`. See iterm2_files.yml.
    archive: false
    recursive: true
    links: true
    # Same reasoning as iterm2_files.yml: a fresh checkout re-stamps every
    # mtime, so comparing on mtime would make this report `changed` on every CI
    # run. `perms` stays on — with `checksum`, rsync still corrects attributes
    # on files it skips, so 0644 is enforced without churning when it already
    # matches.
    checksum: true
    times: false
    perms: true
    owner: false
    group: false
    rsync_path: "{{ 'sudo rsync' if ansible_become | default(true) | bool else omit }}"
    # rsync spawns its own ssh; without this it ignores ssh_common_args, which
    # is where ansible-deploy.yml puts the pinned UserKnownHostsFile and
    # StrictHostKeyChecking=yes.
    use_ssh_args: true
  # synchronize runs rsync on the controller, so play-level become would
  # escalate on the wrong side; rsync_path handles the remote side.
  become: false
  tags: configuration

- name: Install global gitconfig for all users
  ansible.builtin.template:
    src: "{{ role_path }}/templates/dotfiles/.gitconfig"
    dest: /etc/gitconfig
    owner: root
    group: root
    mode: '0644'
  tags: configuration
