---

- name: Setup Debian packages configuration (debconf)
  ansible.builtin.debconf:
    name: "{{ item.name }}"
    question: "{{ item.question }}"
    value: "{{ item.value }}"
    vtype: "{{ item.vtype }}"
  loop: "{{ master_setup_global_debconf_defaults }}"
  tags: configuration

- name: Force LANG to en_US
  ansible.builtin.blockinfile:
    path: /etc/environment
    block: |
      LANG=en_US.UTF-8
      LC_ALL=en_US.UTF-8
  tags: configuration

- name: Install packages
  ansible.builtin.apt:
    name: "{{ master_setup_global_packages_apt | reject('equalto', omit) | list }}"
    state: present
  tags: packages

- name: Create short-name symlinks for Debian tool renames (bat, fd)
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: '/usr/bin/batcat', dest: '/usr/local/bin/bat' }
    - { src: '/usr/bin/fdfind', dest: '/usr/local/bin/fd' }
  tags: packages


# TODO Option "--system" does not work on Debian 12 Bookworm, and "yq" is available as APT package
- name: Install system Pip packages
  ansible.builtin.pip:
    name: "{{ master_setup_global_packages_pip_system }}"
    state: present
    extra_args: "--system"
  tags: packages
  when: master_setup_is_debian_lower_12

# One rsync instead of one `copy` per file, for the same reason as
# iterm2_integration: each module call costs a full round trip (~2.25s from a
# GitHub runner), so a five-item loop spent ~10s doing nothing.
#
# Faithful conversion: files/etcfiles/ mirrors /etc/ exactly, contains precisely
# the files the old loop listed (minus 50unattended-upgrades, now a template, see
# below), and every one of them is 0644 root:root —
# so `perms: true` reproduces the old `mode` and rsync running as root under
# sudo reproduces the old `owner`/`group`. There is no `--delete`, so nothing
# else in /etc is touched.
- name: Install global /etc files
  ansible.posix.synchronize:
    src: "{{ role_path }}/files/etcfiles/"
    dest: /etc/
    # `archive` would add -og and push the controller's owner/group, which never
    # match and would make every run report `changed`. See iterm2_files.yml.
    archive: false
    recursive: true
    links: true
    # Same reasoning as iterm2_files.yml: a fresh checkout re-stamps every
    # mtime, so comparing on mtime would make this report `changed` on every CI
    # run.
    #
    # `perms: false` matters here specifically. With it on, rsync pushes the
    # *source tree's* directory permissions onto the destination — and the
    # source dirs are 755 purely as an artifact of git checkout, not as policy.
    # On quassel.farzy.org /etc/apt and /etc/apt/apt.conf.d are 775, so the sync
    # itemised them as `.d...p...` and would have silently chmod'ed two system
    # directories to match a checkout artifact. `--chmod=F644` would restrict
    # mode-setting to files and leave dirs alone, but macOS ships openrsync,
    # which rejects it outright ("--chmod=F644: invalid argument"), and this
    # role is run from the laptop as well as from CI.
    #
    # Dropping perms costs nothing real: the files already exist at 0644 on
    # every managed host, rsync gives newly created files the source mode
    # (0644), and it leaves the mode of existing files untouched.
    checksum: true
    times: false
    perms: false
    owner: false
    group: false
    rsync_path: "{{ 'sudo rsync' if ansible_become | default(true) | bool else omit }}"
    # rsync spawns its own ssh; without this it ignores ssh_common_args, which
    # is where ansible-deploy.yml puts the pinned UserKnownHostsFile and
    # StrictHostKeyChecking=yes.
    use_ssh_args: true
  # synchronize runs rsync on the controller, so play-level become would
  # escalate on the wrong side; rsync_path handles the remote side.
  become: false
  tags: configuration

# A template rather than part of etcfiles/ because the origins and reboot
# policy depend on the master_setup_unattended_* variables.
- name: Install unattended-upgrades configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/apt/50unattended-upgrades.j2"
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
    # A syntax error anywhere in /etc/apt/apt.conf.d/ makes every apt call on
    # the host fail (including the apt tasks of this very role), so refuse to
    # install a file apt itself cannot parse.
    validate: apt-config -c=%s dump
  tags: configuration

# Debian's timer runs at 06:00 + up to 60 min of random delay. Pinning it makes
# the upgrade time predictable, so Automatic-Reboot-Time can sit right behind it.
# The empty `OnCalendar=` first clears the value inherited from the packaged unit.
- name: Create the apt-daily-upgrade timer drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/apt-daily-upgrade.timer.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: configuration

- name: Schedule the unattended upgrade run
  ansible.builtin.copy:
    dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by Ansible (roles/master_setup/tasks/debian.yml).
      [Timer]
      OnCalendar=
      OnCalendar=*-*-* {{ master_setup_unattended_upgrade_time }}
      RandomizedDelaySec={{ master_setup_unattended_upgrade_random_delay }}
  notify:
    - Reload systemd
    - Restart apt-daily-upgrade timer
  tags: configuration

- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
  register: master_setup_fail2ban_install
  when: master_setup_fail2ban | bool
  tags: configuration

- name: Install fail2ban configuration
  ansible.builtin.template:
    src: "{{ role_path }}/templates/fail2ban/jail.local.j2"
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  when: master_setup_fail2ban | bool
  notify: Restart fail2ban
  tags: configuration

- name: Ensure fail2ban is enabled and running
  ansible.builtin.systemd_service:
    name: fail2ban
    enabled: true
    state: started
  # In check mode the install above is only simulated, so on a host that does not
  # have fail2ban yet the unit does not exist and this task would fail. Expected,
  # not a regression: skip it only in that exact case.
  when:
    - master_setup_fail2ban | bool
    - not (ansible_check_mode and master_setup_fail2ban_install is changed)
  tags: configuration

- name: Install global gitconfig for all users
  ansible.builtin.template:
    src: "{{ role_path }}/templates/dotfiles/.gitconfig"
    dest: /etc/gitconfig
    owner: root
    group: root
    mode: '0644'
  tags: configuration
