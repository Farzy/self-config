---

# `up -d` is a no-op when nothing changed and recreates only the containers
# whose definition moved, so it is safe to fire on any compose change. Players
# on an unaffected server stay connected.
- name: Apply the compose project
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ minecraft_server_root }}"
  become: true
  become_user: "{{ minecraft_server_user }}"
  changed_when: true
  listen: "Restart minecraft compose project"
