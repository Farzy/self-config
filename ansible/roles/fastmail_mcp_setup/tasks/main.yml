---
- name: Create fastmail-mcp system group
  ansible.builtin.group:
    name: "{{ fastmail_mcp_group }}"
    state: present
    system: true

- name: Create fastmail-mcp system user
  ansible.builtin.user:
    name: "{{ fastmail_mcp_user }}"
    group: "{{ fastmail_mcp_group }}"
    home: "{{ fastmail_mcp_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: true

- name: Ensure Fastmail MCP home directory permissions allow group read
  ansible.builtin.file:
    path: "{{ fastmail_mcp_home }}"
    state: directory
    owner: "{{ fastmail_mcp_user }}"
    group: "{{ fastmail_mcp_group }}"
    mode: '0750'

- name: Add claw user to fastmail-mcp group
  ansible.builtin.user:
    name: "{{ openclaw_setup_user | default('claw') }}"
    groups: "{{ fastmail_mcp_group }}"
    append: true

- name: Remove any sudoers configuration for fastmail-mcp user
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ fastmail_mcp_user }}"
    state: absent

- name: Get active groups for fastmail-mcp user
  ansible.builtin.command:
    cmd: "id -Gn {{ fastmail_mcp_user }}"
  register: fastmail_mcp_user_groups_cmd
  changed_when: false
  check_mode: false

- name: Assert fastmail-mcp user is not a member of privileged groups
  ansible.builtin.assert:
    that:
      - "'sudo' not in fastmail_mcp_user_groups_cmd.stdout.split()"
      - "'root' not in fastmail_mcp_user_groups_cmd.stdout.split()"
      - "'wheel' not in fastmail_mcp_user_groups_cmd.stdout.split()"
      - "'shadow' not in fastmail_mcp_user_groups_cmd.stdout.split()"
      - "'adm' not in fastmail_mcp_user_groups_cmd.stdout.split()"
      - "'disk' not in fastmail_mcp_user_groups_cmd.stdout.split()"
    fail_msg: "SECURITY VIOLATION: User {{ fastmail_mcp_user }} belongs to a privileged group! Groups: {{ fastmail_mcp_user_groups_cmd.stdout }}"
    success_msg: "Security assertion passed: User {{ fastmail_mcp_user }} is not a member of any privileged groups."

- name: Check sudo privilege status for fastmail-mcp user
  ansible.builtin.command:
    cmd: "sudo -U {{ fastmail_mcp_user }} -l"
  register: fastmail_mcp_sudo_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Assert fastmail-mcp user has no sudo privileges
  ansible.builtin.assert:
    that:
      - >-
        'not allowed to run sudo' in fastmail_mcp_sudo_check.stdout or
        'is not allowed to run sudo' in fastmail_mcp_sudo_check.stderr or
        fastmail_mcp_sudo_check.rc != 0
    fail_msg: "SECURITY VIOLATION: User {{ fastmail_mcp_user }} has sudo privileges!"
    success_msg: "Security assertion passed: User {{ fastmail_mcp_user }} has no sudo privileges."

- name: Create Fastmail MCP application directory
  ansible.builtin.file:
    path: "{{ fastmail_mcp_app_dir }}"
    state: directory
    owner: "{{ fastmail_mcp_user }}"
    group: "{{ fastmail_mcp_group }}"
    mode: '0755'

# Clone/npm/build below run as fastmail_mcp_user (via become_user) so the directory
# owner declared above actually matches who writes to it - no root-vs-service-account
# mismatch, so no git safe.directory exception is needed for this path. This also
# recursively fixes ownership of any files left root-owned by earlier versions of this
# role that built as root; a no-op once ownership is consistent.
- name: Ensure Fastmail MCP application files are owned by the service account
  ansible.builtin.file:
    path: "{{ fastmail_mcp_app_dir }}"
    state: directory
    owner: "{{ fastmail_mcp_user }}"
    group: "{{ fastmail_mcp_group }}"
    recurse: true

- name: Clone Fastmail MCP repository
  ansible.builtin.git:
    repo: https://github.com/MadLlama25/fastmail-mcp.git
    dest: "{{ fastmail_mcp_app_dir }}"
    version: "{{ fastmail_mcp_version }}"
    force: true
  become: true
  become_user: "{{ fastmail_mcp_user }}"
  # GitHub now returns 401 for anonymous git-upload-pack requests from this
  # host's IP (confirmed via curl/git trace: same request succeeds from other
  # IPs, and hits every public repo, not just this one - anti-abuse throttling
  # on the hosting range, not a repo-specific or local-config issue). Skip
  # /etc/gitconfig's `gh auth git-credential` helper (fastmail-mcp has no gh
  # session) and instead authenticate this one request in-memory with the PAT
  # already provisioned for this host, without writing it to any file.
  environment:
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "http.https://github.com/.extraheader"
    GIT_CONFIG_VALUE_0: "Authorization: Basic {{ ('x-access-token:' ~ openclaw_github_pat) | b64encode }}"
  register: fastmail_mcp_repo

- name: Check if dist/index.js exists
  ansible.builtin.stat:
    path: "{{ fastmail_mcp_app_dir }}/dist/index.js"
  register: fastmail_mcp_dist_stat

- name: Install Fastmail MCP npm dependencies
  community.general.npm:
    path: "{{ fastmail_mcp_app_dir }}"
    state: present
  become: true
  become_user: "{{ fastmail_mcp_user }}"
  when: fastmail_mcp_repo.changed or not fastmail_mcp_dist_stat.stat.exists

- name: Build Fastmail MCP server
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ fastmail_mcp_app_dir }}"
  become: true
  become_user: "{{ fastmail_mcp_user }}"
  when: fastmail_mcp_repo.changed or not fastmail_mcp_dist_stat.stat.exists
  changed_when: true

- name: Install supergateway globally via npm (registry release)
  community.general.npm:
    name: "supergateway@{{ fastmail_mcp_supergateway_version }}"
    global: true
    state: present
  when: fastmail_mcp_supergateway_source == "npm"
  notify: Restart fastmail-mcp

# --- Patched supergateway install (interim fix; drop once upstream ships a release) ---
#
# Context: fastmail-mcp crash-loops (systemd Restart=always, observed roughly every
# 15-90 min) because supergateway shares a single MCP `Server` instance across all SSE
# connections. The MCP SDK forbids calling `.connect()` twice on one `Server`, so a
# second concurrent SSE connection (a reconnect, or two sessions hitting the MCP at
# once) throws "Already connected to a transport" and takes the whole process down.
# Upstream issue: https://github.com/supercorp-ai/supergateway/issues/112
#
# A community PR (#113, by sfasching, unmerged as of 2026-08-06) fixes this by giving
# each session its own `Server` instance: https://github.com/supercorp-ai/supergateway/pull/113
# While testing that branch we found a second, related bug: SSEServerTransport.close()
# invokes onclose() *synchronously* in addition to the async response-close event, so
# the original cleanupSession() (which called server.close() before deleting the
# session map entry) re-entered itself and recursed until "Maximum call stack size
# exceeded". Fixed by deleting the session entry before calling close(); posted as a
# comment on PR #113, and pushed as a second commit on top of it in Farzad's fork:
# https://github.com/Farzy/supergateway/tree/fix/sse-reconnection-crash
#
# supergateway's `bin` entry points at dist/index.js, which is git-ignored and only
# produced by `npm run build` (its own `prepare` script only sets up Husky dev git
# hooks, not a build). So `npm install -g git+<repo>#<branch>` would install a package
# with no dist/ and fail at runtime — we have to clone, build, and install from that
# already-built local checkout instead.
#
# Revert path: once #113 (or a fix incorporating it) merges and a new version is
# published to npm, set fastmail_mcp_supergateway_source back to "npm", bump
# fastmail_mcp_supergateway_version, and optionally remove these tasks plus
# fastmail_mcp_supergateway_build_dir from the host.

- name: Add safe.directory exception for patched supergateway build directory
  community.general.git_config:
    name: safe.directory
    value: "{{ fastmail_mcp_supergateway_build_dir }}"
    scope: global
    # safe.directory is a multi-valued git key, and git_config's default add_mode
    # (replace-all) overwrites *all* existing safe.directory entries instead of
    # appending. Without this, running this task wipes out any safe.directory
    # value set elsewhere in the play (and vice versa).
    add_mode: add
  when: fastmail_mcp_supergateway_source == "git"

- name: Clone patched supergateway branch
  ansible.builtin.git:
    repo: "{{ fastmail_mcp_supergateway_git_repo }}"
    dest: "{{ fastmail_mcp_supergateway_build_dir }}"
    version: "{{ fastmail_mcp_supergateway_git_version }}"
    force: true
  when: fastmail_mcp_supergateway_source == "git"
  # Same anonymous-GitHub-fetch-from-this-IP issue as the fastmail-mcp clone above.
  environment:
    GIT_CONFIG_NOSYSTEM: "1"
    GIT_CONFIG_COUNT: "1"
    GIT_CONFIG_KEY_0: "http.https://github.com/.extraheader"
    GIT_CONFIG_VALUE_0: "Authorization: Basic {{ ('x-access-token:' ~ openclaw_github_pat) | b64encode }}"
  register: fastmail_mcp_supergateway_repo

- name: Check if patched supergateway dist/index.js exists
  ansible.builtin.stat:
    path: "{{ fastmail_mcp_supergateway_build_dir }}/dist/index.js"
  register: fastmail_mcp_supergateway_dist_stat
  when: fastmail_mcp_supergateway_source == "git"

- name: Install patched supergateway npm dependencies
  community.general.npm:
    path: "{{ fastmail_mcp_supergateway_build_dir }}"
    state: present
    # Skip Husky's `prepare` hook (dev-only git commit hooks) — irrelevant and
    # potentially fragile when installing as root in a non-interactive build.
    ignore_scripts: true
  when: >
    fastmail_mcp_supergateway_source == "git" and
    (fastmail_mcp_supergateway_repo.changed or not fastmail_mcp_supergateway_dist_stat.stat.exists)

- name: Build patched supergateway
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ fastmail_mcp_supergateway_build_dir }}"
  when: >
    fastmail_mcp_supergateway_source == "git" and
    (fastmail_mcp_supergateway_repo.changed or not fastmail_mcp_supergateway_dist_stat.stat.exists)
  changed_when: true

- name: Install patched supergateway globally from local build
  # Deliberately not the community.general.npm module: it treats the package as
  # already "present" once installed once and won't reinstall on a rebuilt dist/,
  # since it only checks whether the package name is present, not its content. A
  # plain command keeps the global binary in sync with whatever we just built.
  # Gated on the same condition as the build step above it - only needs to re-run
  # (and only really "changes" anything) when the local build was actually
  # refreshed, otherwise the global package is already in sync.
  ansible.builtin.command:
    cmd: npm install -g --ignore-scripts .
    chdir: "{{ fastmail_mcp_supergateway_build_dir }}"
  when: >
    fastmail_mcp_supergateway_source == "git" and
    (fastmail_mcp_supergateway_repo.changed or not fastmail_mcp_supergateway_dist_stat.stat.exists)
  changed_when: true
  notify: Restart fastmail-mcp

- name: Create Fastmail MCP downloads directory
  ansible.builtin.file:
    path: "{{ fastmail_mcp_home }}/downloads"
    state: directory
    owner: "{{ fastmail_mcp_user }}"
    group: "{{ fastmail_mcp_group }}"
    mode: '0750'

- name: Create Fastmail MCP secrets directory
  ansible.builtin.file:
    path: /etc/fastmail-mcp
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy Fastmail MCP secrets environment file
  ansible.builtin.template:
    src: secrets.env.j2
    dest: /etc/fastmail-mcp/secrets.env
    owner: root
    group: root
    mode: '0600'
  notify: Restart fastmail-mcp

- name: Deploy Fastmail MCP systemd service
  ansible.builtin.template:
    src: fastmail-mcp.service.j2
    dest: /etc/systemd/system/fastmail-mcp.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart fastmail-mcp

- name: Ensure Fastmail MCP service is started and enabled
  ansible.builtin.service:
    name: fastmail-mcp
    state: started
    enabled: true
